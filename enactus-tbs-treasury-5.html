<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Enactus TBS — Treasury</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETBS Treasury">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFC222">
<link id="favicon-link" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312131A'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='30' font-weight='700' fill='%23FFC222' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link id="apple-touch-link" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312131A'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='30' font-weight='700' fill='%23FFC222' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link id="manifest-link" rel="manifest" href="">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --gold: #FFC222;
    --gold-deep: #A8710A;
    --ink: #12131A;
    --muted: #6B7280;
    --bg: #F5F6F8;
    --card: #FFFFFF;
    --border: #E4E6EB;
    --green: #16A34A;
    --red: #DC2626;
    --teal: #0EA5A0;
    --orange: #EA580C;
    --violet: #7C3AED;
    --blue: #2563EB;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 56px;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .muted { color: var(--muted); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 40px; }

  button, input, select, textarea { font-family: inherit; }
  button { cursor: pointer; }
  input, select, textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink);
    border-radius: 9px;
    padding: 9px 11px;
    font-size: 14px;
    outline: none;
  }
  input::placeholder, textarea::placeholder { color: #9CA3AF; }
  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(255,194,34,0.18);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04);
    padding: 16px;
  }

  /* header */
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .logo-badge {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--ink); color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; flex-shrink: 0;
    overflow: hidden;
  }
  .logo-badge img { width: 100%; height: 100%; object-fit: cover; }
  .org-name { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
  .page-title { font-size: 24px; font-weight: 800; margin: 1px 0 0; }

  /* tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 18px 0 18px; overflow-x: auto; }
  .tab {
    background: none; border: none; padding: 10px 4px; margin-right: 18px;
    font-size: 13.5px; font-weight: 600; color: var(--muted);
    border-bottom: 2.5px solid transparent; white-space: nowrap;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--gold); }

  /* hero stat */
  .hero-card {
    background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--gold);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 14px;
  }
  .hero-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 4px; }
  .hero-value { font-size: 30px; font-weight: 700; }

  /* dashboard */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin-bottom: 18px; }
  .stat-card { padding: 14px; }
  .stat-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
  .stat-value { font-size: 18px; font-weight: 700; }
  .bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 10px; }
  .bar-chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; min-width: 0; }
  .bar-chart-bars { display: flex; align-items: flex-end; gap: 3px; height: 100px; width: 100%; justify-content: center; }
  .bar-chart-bar { width: 9px; border-radius: 3px 3px 0 0; min-height: 2px; }
  .bar-chart-label { font-size: 10px; color: var(--muted); margin-top: 6px; font-weight: 600; }
  .chart-legend { display: flex; gap: 16px; justify-content: center; margin-top: 12px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .chart-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .catbar-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .catbar-label { font-size: 12.5px; font-weight: 600; width: 108px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .catbar-track { flex: 1; height: 8px; border-radius: 999px; background: #EEF0F3; overflow: hidden; }
  .catbar-fill { height: 100%; border-radius: 999px; }
  .catbar-amt { font-size: 11.5px; font-weight: 700; width: 76px; text-align: right; flex-shrink: 0; }

  /* account cards */
  .acct-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px,1fr)); gap: 10px; margin-bottom: 18px; }
  .acct-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .acct-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .acct-avatar { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10.5px; font-weight: 800; flex-shrink: 0; }
  .acct-name { font-size: 12.5px; font-weight: 700; }
  .acct-value { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .icon-btn { background: none; border: none; color: var(--muted); padding: 3px; display: flex; }
  .icon-btn:hover { color: var(--ink); }
  .bar-track { height: 6px; border-radius: 999px; background: #EEF0F3; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }

  /* pills / badges */
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
    border: 1px solid var(--border); color: var(--ink);
  }

  /* buttons */
  .btn { border-radius: 9px; padding: 9px 14px; font-size: 13px; font-weight: 700; border: 1px solid var(--border); background: #fff; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: #C9CDD6; }
  .btn-primary { background: var(--ink); color: var(--gold); border: none; }
  .btn-primary:hover { background: #23242E; }
  .btn-ghost { background: none; border: none; color: var(--muted); }

  /* transaction list */
  .tx-row { display: flex; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--border); gap: 10px; }
  .tx-row:last-child { border-bottom: none; }
  .tx-date-cell { font-size: 11px; color: var(--muted); width: 58px; flex-shrink: 0; line-height: 1.35; }
  .tx-time { font-size: 9.5px; opacity: 0.75; }
  .tx-edit-form { padding: 12px; margin: 6px 0; background: #FAFAFB; border: 1px solid var(--border); border-radius: 12px; width: 100%; }
  .tx-main { min-width: 0; flex: 1; }
  .tx-cat { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-meta { font-size: 11.5px; color: var(--muted); }
  .tx-amt { font-size: 13.5px; font-weight: 700; flex-shrink: 0; display: flex; align-items: center; gap: 3px; }

  form.panel { margin-top: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 110px; }
  .seg { display: flex; gap: 8px; margin-bottom: 12px; }
  .seg button { flex: 1; padding: 9px 10px; border-radius: 9px; font-size: 12.5px; font-weight: 700; border: 1px solid var(--border); background: #fff; color: var(--ink); }
  .seg button.active-income { background: var(--green); border-color: var(--green); color: #fff; }
  .seg button.active-expense { background: var(--red); border-color: var(--red); color: #fff; }
  .seg button.active-transfer { background: var(--blue); border-color: var(--blue); color: #fff; }
  .field-label { font-size: 11px; font-weight: 700; color: var(--muted); margin: 2px 2px 5px; letter-spacing: 0.03em; }
  .acct-pick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .acct-pick button { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); background: #fff; color: var(--ink); }
  .acct-pick button.active { background: var(--gold); border-color: var(--gold); }

  .section-title { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 800; margin: 22px 0 10px; }

  .empty { padding: 22px; text-align: center; color: var(--muted); font-size: 13px; }

  .opp-card { margin-bottom: 10px; }
  .opp-name { font-size: 14.5px; font-weight: 700; margin-bottom: 5px; }
  .opp-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; align-items: center; }
  .opp-notes { font-size: 12.5px; color: #3F4451; }
  .status-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
  .status-row button { font-size: 10.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: #fff; }
  .status-row button.active { background: var(--ink); color: var(--gold); border-color: var(--ink); }

  .note-card { margin-bottom: 10px; }
  .note-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .note-title { font-size: 14px; font-weight: 700; }
  .note-date { font-size: 11px; color: var(--muted); }
  .note-body { font-size: 13px; margin-top: 10px; white-space: pre-wrap; line-height: 1.5; }

  .member-avatar { width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 800; flex-shrink: 0; }
  .fee-row { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .fee-row:last-child { border-bottom: none; }
  .fee-label { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toggle-pill { border: none; border-radius: 999px; padding: 5px 13px; font-size: 11px; font-weight: 800; color: #fff; flex-shrink: 0; }
  .toggle-pill.paid { background: var(--green); }
  .toggle-pill.unpaid { background: var(--red); }
  .fee-amount-input { width: 68px; flex-shrink: 0; padding: 5px 6px; font-size: 12px; text-align: right; }
  .tick-list { max-height: 240px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; padding: 4px 8px; }
  .tick-row { display: flex; align-items: center; gap: 8px; padding: 7px 2px; font-size: 12.5px; font-weight: 600; cursor: pointer; border-bottom: 1px solid var(--border); }
  .tick-row:last-child { border-bottom: none; }
  .tick-row input[type="checkbox"] { width: 15px; height: 15px; flex-shrink: 0; }

  .insight-card { display: flex; gap: 12px; margin-bottom: 10px; }
  .insight-icon { width: 34px; height: 34px; border-radius: 9px; background: #FFF6DE; color: var(--gold-deep); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .insight-title { font-size: 13.5px; font-weight: 700; margin-bottom: 2px; }
  .insight-desc { font-size: 12.5px; color: var(--muted); line-height: 1.4; }

  .chat-panel { display: flex; flex-direction: column; height: 420px; padding: 0; overflow: hidden; }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
  .bubble { padding: 9px 12px; border-radius: 13px; font-size: 13.5px; line-height: 1.45; max-width: 82%; white-space: pre-wrap; }
  .bubble-user { background: var(--ink); color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
  .bubble-ai { background: #F1F2F5; color: var(--ink); align-self: flex-start; border-bottom-left-radius: 3px; }
  .chat-row-user { display: flex; align-items: center; gap: 6px; align-self: flex-end; max-width: 100%; }
  .chat-edit-btn { opacity: 0; transition: opacity .15s; flex-shrink: 0; }
  .chat-row-user:hover .chat-edit-btn { opacity: 1; }
  .chat-edit-form { align-self: flex-end; width: 90%; background: #FAFAFB; border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
  .chat-edit-form textarea { font-size: 13px; }
  .bubble code { background: rgba(0,0,0,0.06); padding: 1px 4px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 0.9em; }
  .bubble ul { text-align: left; }
  .bubble li { margin: 2px 0; }
  .chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
  .starter-chip { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 600; }
  .starter-chip:hover { border-color: var(--gold); }

  .topbar { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 4px; flex-wrap: wrap; }
  .topbar .btn { font-size: 12px; padding: 6px 10px; }

  svg.icon { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* lock screen */
  .lock-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lock-card { width: 100%; max-width: 340px; background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 26px 24px; box-shadow: 0 2px 10px rgba(16,24,40,0.06); text-align: center; }
  .lock-logo { width: 46px; height: 46px; border-radius: 12px; background: var(--ink); color: var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px; margin: 0 auto 14px; overflow: hidden; }
  .lock-logo img { width: 100%; height: 100%; object-fit: cover; }
  .lock-title { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
  .lock-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
  .pin-input { text-align: center; font-size: 22px; letter-spacing: 6px; font-family: 'IBM Plex Mono', monospace; padding: 12px; margin-bottom: 10px; }
  .pin-field-wrap { position: relative; margin-bottom: 10px; }
  .pin-field-wrap input { padding-right: 40px; margin-bottom: 0; }
  .pin-toggle-btn { position: absolute; right: 8px; top: 0; bottom: 0; margin: auto; height: 22px; background: none; border: none; color: var(--muted); padding: 0 4px; display: flex; align-items: center; }
  .lock-error { font-size: 12px; color: var(--red); font-weight: 600; margin-bottom: 10px; min-height: 15px; }
  .lock-link { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; margin-top: 12px; }
  .lock-warning { font-size: 12.5px; color: var(--red); background: #FEF2F2; border: 1px solid #FCA5A5; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; line-height: 1.5; text-align: left; }

  /* pin modal */
  .pin-modal-overlay { position: fixed; inset: 0; background: rgba(18,19,26,0.55); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  .pin-modal { width: 100%; max-width: 320px; background: #fff; border-radius: 16px; padding: 20px; }
  .pin-modal-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .pin-modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  .pin-modal-input { text-align: center; font-size: 20px; letter-spacing: 5px; font-family: 'IBM Plex Mono', monospace; margin-bottom: 8px; }
  .pin-modal-error { font-size: 11.5px; color: var(--red); font-weight: 600; margin-bottom: 8px; }
  .pin-modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  /* cloud sync */
  .sync-badge { font-size: 11px; font-weight: 700; color: var(--muted); align-self: center; margin-right: auto; }
  .sync-badge.ok { color: var(--green); }
  .sync-badge.err { color: var(--red); }
  .sync-modal-overlay { position: fixed; inset: 0; background: rgba(18,19,26,0.55); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  .sync-modal { width: 100%; max-width: 380px; background: #fff; border-radius: 16px; padding: 22px; max-height: 90vh; overflow-y: auto; }
  .sync-modal-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  .sync-modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.55; }
  .sync-modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--muted); }
  .sync-modal-row { margin-bottom: 10px; }
  .sync-modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .sync-status-line { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

  /* monthly report */
  #report-print-area { display: none; }
  .report-modal-overlay { position: fixed; inset: 0; background: rgba(18,19,26,0.55); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  .report-modal { width: 100%; max-width: 340px; background: #fff; border-radius: 16px; padding: 22px; }
  .report-modal-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .report-modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
  .report-modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

  @media print {
    body * { visibility: hidden; }
    #report-print-area, #report-print-area * { visibility: visible; }
    #report-print-area { display: block !important; position: absolute; top: 0; left: 0; width: 100%; }
    .report-page { padding: 0; }
    .report-tx-table tr { page-break-inside: avoid; }
  }
  .report-page { font-family: 'Inter', system-ui, sans-serif; color: #14151A; max-width: 720px; margin: 0 auto; padding: 24px; }
  .report-header { display: flex; align-items: center; gap: 14px; border-bottom: 3px solid #FFC222; padding-bottom: 14px; margin-bottom: 10px; }
  .report-org { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #6B7280; }
  .report-title { font-size: 20px; font-weight: 800; }
  .report-month { font-size: 14px; font-weight: 600; color: #6B7280; }
  .report-meta { font-size: 11px; color: #9CA3AF; margin-bottom: 20px; }
  .report-page h3 { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #14151A; border-bottom: 1px solid #E4E6EB; padding-bottom: 5px; margin: 22px 0 8px; }
  .report-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .report-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: #6B7280; padding: 5px 8px; border-bottom: 1.5px solid #14151A; }
  .report-table td { padding: 6px 8px; border-bottom: 1px solid #EEF0F3; }
  .report-table tr:last-child td { border-bottom: none; }
  .report-table td.num, .report-table th.num { text-align: right; font-family: 'IBM Plex Mono', monospace; }
  .report-pos { color: #16A34A; font-weight: 700; }
  .report-neg { color: #DC2626; font-weight: 700; }
  .report-footer { margin-top: 28px; padding-top: 10px; border-top: 1px solid #E4E6EB; font-size: 10px; color: #9CA3AF; }
  .report-empty { font-size: 12.5px; color: #9CA3AF; padding: 10px 0; }

  @media (max-width: 420px) {
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div id="lock-screen"></div>
<div id="report-print-area"></div>
<div class="wrap" id="app-wrap" style="display:none;">

  <div class="topbar">
    <span id="sync-badge" class="sync-badge"></span>
    <button class="btn" onclick="Sync.open()">☁ Cloud sync</button>
    <button class="btn" onclick="Report.open()">🖨 Monthly report</button>
    <button class="btn" onclick="App.exportData()">⇩ Export data</button>
    <button class="btn" onclick="document.getElementById('import-file').click()">⇧ Import data</button>
    <button class="btn" onclick="Lock.changePin()">🔒 Change PIN</button>
    <button class="btn" onclick="Lock.lockNow()">Lock</button>
    <button class="btn" style="color:var(--red);" onclick="App.resetAll()">Reset data</button>
    <input type="file" id="import-file" accept="application/json" style="display:none" onchange="App.importData(event)">
  </div>

  <div class="header">
    <div class="logo-badge" id="header-logo">E</div>

function namesLikelyMatch(a, b) {

  return (parts[0][0] + parts[1][0]).toUpperCase();
}

// ============== UTILS ==============
function fmtDT(n) {
  const v = Number(n) || 0;
  const sign = v < 0 ? '-' : '';
  return sign + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) + ' DT';
}
function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); }
  catch(e) { return d; }
}
function txDateCell(t) {
  return `<div class="tx-date-cell"><div class="mono">${fmtDate(t.date)}</div>${t.time ? `<div class="mono tx-time">${esc(t.time)}</div>` : ''}</div>`;
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowHHMM() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function daysUntil(d) {
  if (!d) return null;
  return Math.round((new Date(d+'T00:00:00') - new Date(todayISO()+'T00:00:00')) / 86400000);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

// Minimal markdown for assistant chat bubbles. Escapes everything first (so it's safe),
// then re-introduces a small, fixed set of formatting: **bold**, `code`, "- " bullets,
// and line breaks. Deliberately tiny — not a full markdown engine.
function mdLite(raw) {
  let s = esc(raw == null ? '' : raw);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = s.split('\n');
  let html = '', inList = false;
  for (const line of lines) {
    const m = line.match(/^\s*[-*]\s+(.*)$/);
    if (m) {
      if (!inList) { html += '<ul style="margin:6px 0;padding-left:18px;">'; inList = true; }
      html += '<li>' + m[1] + '</li>';
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += line + '<br>';
    }
  }
  if (inList) html += '</ul>';
  return html.replace(/<br>$/, '');
}

// Restyles a simple pill button group (single "active" class) in place, without
// re-rendering the surrounding form — so any text already typed into other fields
// in that same form isn't lost.
// Toggles a masked PIN field between hidden (dots) and visible (digits). Expects the
// toggle button to be the input's next sibling inside a .pin-field-wrap.
function togglePinVisibility(btn) {
  const input = btn.previousElementSibling;
  if (!input) return;
  if (input.type === 'password') {
    input.type = 'tel';
    btn.innerHTML = svg('eyeOff', 14);
  } else {
    input.type = 'password';
    btn.innerHTML = svg('eye', 14);
  }
  input.focus();
}

function selectPill(btn) {
  const group = btn.parentElement;
  group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
// Same idea for the income/expense/transfer segmented control, which uses one of
// three different active classes instead of a single shared one.
function selectSegPill(btn, activeClass) {
  const group = btn.parentElement;
  group.querySelectorAll('button').forEach(b => b.classList.remove('active-income', 'active-expense', 'active-transfer'));
  btn.classList.add(activeClass);
}

// ============== CRYPTO (PIN lock + encrypted backups) ==============
function bufToB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function deriveAesKey(pin, salt) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    material,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptWithPin(pin, plaintext) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(pin, salt);
  const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plaintext));
  return { salt: bufToB64(salt), iv: bufToB64(iv), data: bufToB64(cipherBuf) };
}

async function decryptWithPin(pin, payload) {
  const key = await deriveAesKey(pin, b64ToBuf(payload.salt));
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(payload.iv) }, key, b64ToBuf(payload.data));
  return new TextDecoder().decode(plainBuf);
}

// Reusable numeric-PIN prompt modal. Resolves to the entered digits, or null if cancelled.
function askPin({ title, subtitle, confirmLabel }) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'pin-modal-overlay';
    overlay.innerHTML = `
      <div class="pin-modal">
        <div class="pin-modal-title">${esc(title)}</div>
        ${subtitle ? `<div class="pin-modal-sub">${esc(subtitle)}</div>` : ''}
        <div class="pin-field-wrap">
          <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="pin-modal-input" placeholder="••••">
          <button type="button" class="pin-toggle-btn" onclick="togglePinVisibility(this)">${svg('eye', 14)}</button>
        </div>
        <div class="pin-modal-error" style="display:none;"></div>
        <div class="pin-modal-actions">
          <button type="button" class="btn" data-act="cancel">Cancel</button>
          <button type="button" class="btn btn-primary" data-act="ok">${esc(confirmLabel || 'Continue')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('.pin-modal-input');
    const errEl = overlay.querySelector('.pin-modal-error');
    setTimeout(() => input.focus(), 0);
    function cleanup(val) { document.body.removeChild(overlay); resolve(val); }
    overlay.querySelector('[data-act="cancel"]').onclick = () => cleanup(null);
    overlay.querySelector('[data-act="ok"]').onclick = submit;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    function submit() {
      const v = input.value.trim();
      if (!/^[0-9]{4,8}$/.test(v)) { errEl.textContent = 'Enter 4–8 numbers.'; errEl.style.display = 'block'; return; }
      cleanup(v);
    }
  });
}

// ============== CLOUD SYNC (optional — sync shared data via a Google Sheet) ==============

function syncUrl() { return localStorage.getItem('etbs_sync_url') || ''; }
function syncSecret() { return localStorage.getItem('etbs_sync_secret') || ''; }
function syncConnected() { return !!(syncUrl() && syncSecret()); }
function syncReady() { return syncConnected() && localStorage.getItem('etbs_sync_ready') === '1'; }
function syncLastAt() { return localStorage.getItem('etbs_sync_last') || ''; }

async function cloudGetAll() {
  const url = syncUrl();
  const res = await fetch(`${url}?action=getAll&secret=${encodeURIComponent(syncSecret())}`);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.data || {};
}

async function cloudSetKey(key, value) {
  const url = syncUrl();
  const res = await fetch(`${url}?action=set&secret=${encodeURIComponent(syncSecret())}`, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight Apps Script can't answer
    body: JSON.stringify({ key, value }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return true;
}

// Push every shared-data key currently in local state up to the sheet.
async function cloudPushAll() {
  await cloudSetKey('transactions', state.transactions);
  await cloudSetKey('adjustments', state.adjustments);
  await cloudSetKey('opportunities', state.opportunities);
  await cloudSetKey('notes', state.notes);
  await cloudSetKey('generalNotes', state.generalNotes);
  await cloudSetKey('payables', state.payables);
  await cloudSetKey('members', state.members);
  await cloudSetKey('feeEvents', state.feeEvents);
  await cloudSetKey('feeParticipants', state.feeParticipants);
  await cloudSetKey('boardMembers', state.boardMembers);
  await cloudSetKey('tadwiras', state.tadwiras);
  await cloudSetKey('tadwiraContributions', state.tadwiraContributions);
  localStorage.setItem('etbs_sync_last', new Date().toISOString());
}

// Pull the sheet's data down and make it this device's working copy.
async function cloudPullAll() {
  const data = await cloudGetAll();
  if (data.transactions) { state.transactions = JSON.parse(data.transactions); saveJSON('etbs_transactions', state.transactions); }
  if (data.adjustments) { state.adjustments = JSON.parse(data.adjustments); saveJSON('etbs_adjustments', state.adjustments); }
  if (data.opportunities) { state.opportunities = JSON.parse(data.opportunities); saveJSON('etbs_opportunities', state.opportunities); }
  if (data.notes) { state.notes = JSON.parse(data.notes); saveJSON('etbs_notes', state.notes); }
  if (data.generalNotes) { state.generalNotes = JSON.parse(data.generalNotes); saveJSON('etbs_general_notes', state.generalNotes); }
  if (data.payables) { state.payables = JSON.parse(data.payables); saveJSON('etbs_payables', state.payables); }
  if (data.members) { state.members = JSON.parse(data.members); saveJSON('etbs_members', state.members); }
  if (data.feeEvents) { state.feeEvents = JSON.parse(data.feeEvents); saveJSON('etbs_fee_events', state.feeEvents); }
  if (data.feeParticipants) { state.feeParticipants = JSON.parse(data.feeParticipants); saveJSON('etbs_fee_participants', state.feeParticipants); }
  if (data.boardMembers) { state.boardMembers = JSON.parse(data.boardMembers); saveJSON('etbs_board_members', state.boardMembers); }
  if (data.tadwiras) { state.tadwiras = JSON.parse(data.tadwiras); saveJSON('etbs_tadwiras', state.tadwiras); }
  if (data.tadwiraContributions) { state.tadwiraContributions = JSON.parse(data.tadwiraContributions); saveJSON('etbs_tadwira_contributions', state.tadwiraContributions); }
  localStorage.setItem('etbs_sync_last', new Date().toISOString());
}

// Called after any shared-data mutation. Saves locally (always) and, once this device
// is reconciled with the sheet, best-effort pushes the change up too.
let syncStatus = 'idle'; // idle | syncing | error
async function syncPushInBackground() {
  if (!syncReady()) return;
  syncStatus = 'syncing';
  renderSyncBadge();
  try {
    await cloudPushAll();
    syncStatus = 'idle';
  } catch (err) {
    syncStatus = 'error';
    console.error('cloud push failed', err);
  }
  renderSyncBadge();
}

function txDelta() {
  const b = { carte_bancaire: 0, d17: 0, cash: 0 };
  state.transactions.forEach(t => {
    const amt = Number(t.amount) || 0;
    if (t.type === 'transfer') {
      b[t.fromAccount] = (b[t.fromAccount] || 0) - amt;
      b[t.toAccount] = (b[t.toAccount] || 0) + amt;
    } else {
      b[t.account] = (b[t.account] || 0) + (t.type === 'income' ? amt : -amt);
    }
  });
  return b;
}
function balances() {
  const delta = txDelta();
  const b = {};
  ACCOUNTS.forEach(a => b[a.id] = (state.adjustments[a.id] || 0) + (delta[a.id] || 0));
  return b;
}

// Balance per account using only transactions dated on/before cutoffISO (YYYY-MM-DD).
// Adjustments aren't individually dated, so they're treated as always in effect —
// a reasonable approximation given how account corrections are used in this app.
function balancesAsOf(cutoffISO) {
  const b = { carte_bancaire: 0, d17: 0, cash: 0 };
  state.transactions.forEach(t => {
    if (!t.date || t.date > cutoffISO) return;
    const amt = Number(t.amount) || 0;
    if (t.type === 'transfer') {
      b[t.fromAccount] = (b[t.fromAccount] || 0) - amt;
      b[t.toAccount] = (b[t.toAccount] || 0) + amt;
    } else {
      b[t.account] = (b[t.account] || 0) + (t.type === 'income' ? amt : -amt);
    }
  });
  ACCOUNTS.forEach(a => b[a.id] = (state.adjustments[a.id] || 0) + (b[a.id] || 0));
  return b;
}

function addDaysISO(iso, days) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function categoryTotals(type) {
  const totals = {};
  state.transactions.filter(t => t.type === type).forEach(t => {
    totals[t.category] = (totals[t.category] || 0) + (Number(t.amount) || 0);
  });
  return Object.entries(totals).sort((a, b) => b[1] - a[1]);
}

function lastNMonths(n) {
  const arr = [];
  const now = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    arr.push({ key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), label: d.toLocaleDateString('en-GB', { month: 'short' }) });
  }
  return arr;
}

// Creates a real ledger transaction (so it shows up in Treasury/Dashboard like any other
// entry) as the result of settling an AP/AR item or a member fee. Returns the new tx id.
function createSettlementTransaction({ type, account, category, amount, note, date }) {
  const entry = {
    id: uid(), createdAt: Date.now(), type, account, category, amount,
    date: date || todayISO(), time: nowHHMM(), note: note || '', loggedBy: state.loggedBy || '',
  };
  state.transactions.unshift(entry);
  saveJSON('etbs_transactions', state.transactions);
  syncPushInBackground();
  return entry.id;
}

    const date = f.date.value || todayISO();
    const txType = item.kind === 'payable' ? 'expense' : 'income';
    const category = item.kind === 'payable' ? 'Accounts payable' : 'Accounts receivable';
    const txId = createSettlementTransaction({
      type: txType, account, category, amount: item.amount,
      note: item.description + (item.counterparty ? ' — ' + item.counterparty : ''),
      date,
    });
    state.payables = state.payables.map(p => p.id === id ? { ...p, status: 'settled', settledDate: date, account, txId } : p);
    saveJSON('etbs_payables', state.payables);
    syncPushInBackground();
    state.ui.settlingApArId = null;
    render();
  },

  // ---- Members & fee events ----
  toggleMemberForm() { state.ui.showMemberForm = !state.ui.showMemberForm; render(); },
  submitMember(e) {
    e.preventDefault();
    const name = e.target.name.value.trim();
    if (!name) return;
    state.members.unshift({ id: uid(), name });
    saveJSON('etbs_members', state.members);
    syncPushInBackground();
    state.ui.showMemberForm = false;
    render();
  },
  toggleBulkMemberForm() { state.ui.showBulkMemberForm = !state.ui.showBulkMemberForm; render(); },
  submitBulkMembers(e) {
    e.preventDefault();
    const raw = e.target.names.value;
    // One name per line is the main format; a comma within a line also splits, in case
    // someone pastes a horizontal list instead of a vertical one.
    const candidates = raw.split(/\r?\n/).flatMap(line => line.split(',')).map(s => s.trim()).filter(Boolean);
    const existingLower = new Set(state.members.map(m => m.name.trim().toLowerCase()));
    const seenThisBatch = new Set();
    let added = 0, skipped = 0;
    candidates.forEach(name => {
      const key = name.toLowerCase();
      if (existingLower.has(key) || seenThisBatch.has(key)) { skipped++; return; }
      state.members.unshift({ id: uid(), name });
      seenThisBatch.add(key);
      added++;
    });
    if (added > 0) {
      saveJSON('etbs_members', state.members);
      syncPushInBackground();
    }
    state.ui.showBulkMemberForm = false;
    render();
    if (added || skipped) {
      alert(`Added ${added} member${added === 1 ? '' : 's'}.` + (skipped ? ` Skipped ${skipped} already in the roster or repeated in the list.` : ''));
    }
  },
  deleteMember(id) {
    if (!confirm('Remove this member? Their entries in fee events go too — transactions already recorded stay in the ledger.')) return;
    state.members = state.members.filter(m => m.id !== id);
    state.feeParticipants = state.feeParticipants.filter(p => p.memberId !== id);
    saveJSON('etbs_members', state.members);
    saveJSON('etbs_fee_participants', state.feeParticipants);
    syncPushInBackground();
    render();
  },

  toggleFeeEventForm() { state.ui.showFeeEventForm = !state.ui.showFeeEventForm; render(); },
  setFeeEventAccount(id, btn) { state.ui.feeEventAccount = id; if (btn) selectPill(btn); },
  submitFeeEvent(e) {
    e.preventDefault();
    const f = e.target;
    const name = f.name.value.trim();
    const amt = parseFloat(f.amount.value);
    if (!name || !amt || amt <= 0) return;
    const ev = { id: uid(), name, amount: amt, account: state.ui.feeEventAccount, createdAt: Date.now() };
    state.feeEvents.unshift(ev);
    saveJSON('etbs_fee_events', state.feeEvents);
    syncPushInBackground();
    state.ui.showFeeEventForm = false;
    state.ui.openFeeEventId = ev.id;
    render();
  },
  deleteFeeEvent(id) {
    if (!confirm('Delete this fee event and its participant list? Transactions already recorded stay in the ledger.')) return;
    state.feeEvents = state.feeEvents.filter(x => x.id !== id);
    state.feeParticipants = state.feeParticipants.filter(p => p.eventId !== id);
    saveJSON('etbs_fee_events', state.feeEvents);
    saveJSON('etbs_fee_participants', state.feeParticipants);
    syncPushInBackground();
    render();
  },
  toggleFeeEventOpen(id) { state.ui.openFeeEventId = state.ui.openFeeEventId === id ? null : id; render(); },

  toggleAddParticipants(eventId) { state.ui.addingParticipantsFor = state.ui.addingParticipantsFor === eventId ? null : eventId; render(); },
  // Ticking a roster checkbox adds them to this event; unticking removes them — but only
  // while unpaid, so a stray click can't quietly undo a real payment.
  toggleParticipantFromRoster(eventId, memberId, checked) {
    const existing = state.feeParticipants.find(p => p.eventId === eventId && p.memberId === memberId);
    if (checked) {
      if (existing) return;
      const ev = state.feeEvents.find(x => x.id === eventId);
      if (!ev) return;
      state.feeParticipants.push({ id: uid(), eventId, memberId, customName: null, amount: ev.amount, status: 'unpaid' });
    } else {
      if (!existing || existing.status === 'paid') { render(); return; }
      state.feeParticipants = state.feeParticipants.filter(p => p.id !== existing.id);
    }
    saveJSON('etbs_fee_participants', state.feeParticipants);
    syncPushInBackground();
    render();
  },
  toggleAddCustomName(eventId) { state.ui.addingCustomNameFor = state.ui.addingCustomNameFor === eventId ? null : eventId; render(); },
  submitCustomParticipant(e, eventId) {
    e.preventDefault();
    const name = e.target.customName.value.trim();
    if (!name) return;
    const ev = state.feeEvents.find(x => x.id === eventId);
    if (!ev) return;
    state.feeParticipants.push({ id: uid(), eventId, memberId: null, customName: name, amount: ev.amount, status: 'unpaid' });
    saveJSON('etbs_fee_participants', state.feeParticipants);
    syncPushInBackground();
    state.ui.addingCustomNameFor = null;
    render();
  },
  removeParticipant(id) {
    const p = state.feeParticipants.find(x => x.id === id);
    if (!p) return;
    if (p.status === 'paid') {
      if (!confirm('This person already paid — removing them also deletes that transaction and takes the money back out. Continue?')) return;
      if (p.txId) { state.transactions = state.transactions.filter(t => t.id !== p.txId); saveJSON('etbs_transactions', state.transactions); }
    }
    state.feeParticipants = state.feeParticipants.filter(x => x.id !== id);
    saveJSON('etbs_fee_participants', state.feeParticipants);
    syncPushInBackground();
    render();
  },
  setParticipantAmount(id, val) {
    const amt = parseFloat(val);
    if (isNaN(amt) || amt < 0) return;
    state.feeParticipants = state.feeParticipants.map(p => p.id === id ? { ...p, amount: amt } : p);
    saveJSON('etbs_fee_participants', state.feeParticipants);
    syncPushInBackground();
  },
  // One tap: unpaid -> paid records a real transaction; paid -> unpaid deletes that
  // transaction again, taking the money back out of the account it went into.
  togglePaid(participantId) {
    const p = state.feeParticipants.find(x => x.id === participantId);
    if (!p) return;
    const ev = state.feeEvents.find(x => x.id === p.eventId);
    if (!ev) return;
    if (p.status === 'paid') {
      if (p.txId) { state.transactions = state.transactions.filter(t => t.id !== p.txId); saveJSON('etbs_transactions', state.transactions); }
      state.feeParticipants = state.feeParticipants.map(x => x.id === participantId ? { ...x, status: 'unpaid', paidDate: null, txId: null } : x);
    } else {
      const name = p.memberId ? ((state.members.find(m => m.id === p.memberId) || {}).name || 'Member') : (p.customName || 'Guest');
      const date = todayISO();
      const txId = createSettlementTransaction({
        type: 'income', account: ev.account, category: 'Membership fees', amount: p.amount,
        note: name + ' — ' + ev.name,
        date,
      });
      state.feeParticipants = state.feeParticipants.map(x => x.id === participantId ? { ...x, status: 'paid', paidDate: date, txId } : x);
    }
    saveJSON('etbs_fee_participants', state.feeParticipants);
    syncPushInBackground();
    render();
  },

  // ---- Tadwira (informal board pooling — never touches the treasury) ----
  toggleTadwiraForm() { state.ui.showTadwiraForm = !state.ui.showTadwiraForm; render(); },
  submitTadwira(e) {
    e.preventDefault();
    const f = e.target;
    const description = f.description.value.trim();
    if (!description) return;
    const totalCost = f.totalCost.value ? parseFloat(f.totalCost.value) : null;
    const tw = { id: uid(), description, totalCost, createdAt: Date.now(), date: todayISO() };
    state.tadwiras.unshift(tw);
    // Default each board member's expected share to an even split of the total cost —
    // divides by however many board members there currently are, so this stays correct
    // if the board's size ever changes.
    if (totalCost && state.boardMembers.length > 0) {
      const perPerson = Math.round((totalCost / state.boardMembers.length) * 1000) / 1000;
      state.boardMembers.forEach(m => {
        state.tadwiraContributions.push({ id: uid(), tadwiraId: tw.id, boardMemberId: m.id, expected: perPerson, paid: 0, status: 'unpaid' });
      });
      saveJSON('etbs_tadwira_contributions', state.tadwiraContributions);
    }
    saveJSON('etbs_tadwiras', state.tadwiras);
    syncPushInBackground();
    state.ui.showTadwiraForm = false;
    state.ui.openTadwiraId = tw.id;
    render();
  },
  deleteTadwira(id) {
    if (!confirm('Delete this Tadwira and its contribution records? This never touched the treasury, so nothing needs reversing there.')) return;
    state.tadwiras = state.tadwiras.filter(t => t.id !== id);
    state.tadwiraContributions = state.tadwiraContributions.filter(c => c.tadwiraId !== id);
    saveJSON('etbs_tadwiras', state.tadwiras);
    saveJSON('etbs_tadwira_contributions', state.tadwiraContributions);
    syncPushInBackground();
    render();
  },
  toggleTadwiraOpen(id) { state.ui.openTadwiraId = state.ui.openTadwiraId === id ? null : id; render(); },

  setContributionExpected(tadwiraId, boardMemberId, val) {
    const amt = parseFloat(val);
    const clean = isNaN(amt) || amt < 0 ? 0 : amt;
    const idx = state.tadwiraContributions.findIndex(c => c.tadwiraId === tadwiraId && c.boardMemberId === boardMemberId);
    if (idx === -1) {
      state.tadwiraContributions.push({ id: uid(), tadwiraId, boardMemberId, expected: clean, paid: 0, status: 'unpaid' });
    } else {
      state.tadwiraContributions[idx] = { ...state.tadwiraContributions[idx], expected: clean };
    }
    saveJSON('etbs_tadwira_contributions', state.tadwiraContributions);
    syncPushInBackground();
  },
  setContributionAmount(tadwiraId, boardMemberId, val) {
    const amt = parseFloat(val);
    const clean = isNaN(amt) || amt < 0 ? 0 : amt;
    const idx = state.tadwiraContributions.findIndex(c => c.tadwiraId === tadwiraId && c.boardMemberId === boardMemberId);
    if (idx === -1) {
      state.tadwiraContributions.push({ id: uid(), tadwiraId, boardMemberId, expected: 0, paid: clean, status: 'unpaid' });
    } else {
      state.tadwiraContributions[idx] = { ...state.tadwiraContributions[idx], paid: clean };
    }
    saveJSON('etbs_tadwira_contributions', state.tadwiraContributions);
    syncPushInBackground();
  },
  // One tap: unpaid -> paid locks in whatever amount is currently set (defaulting to
  // the expected share if nothing's been typed yet); paid -> unpaid just reopens it for
  // editing. Tadwira never touches the treasury, so there's nothing to reverse.
  toggleContributionPaid(tadwiraId, boardMemberId) {
    const idx = state.tadwiraContributions.findIndex(c => c.tadwiraId === tadwiraId && c.boardMemberId === boardMemberId);
    if (idx === -1) {
      state.tadwiraContributions.push({ id: uid(), tadwiraId, boardMemberId, expected: 0, paid: 0, status: 'paid', paidDate: todayISO() });
    } else {
      const rec = state.tadwiraContributions[idx];
      if (rec.status === 'paid') {
        state.tadwiraContributions[idx] = { ...rec, status: 'unpaid', paidDate: null };
      } else {
        const amount = (rec.paid && rec.paid > 0) ? rec.paid : rec.expected;
        state.tadwiraContributions[idx] = { ...rec, paid: amount, status: 'paid', paidDate: todayISO() };
      }
    }
    saveJSON('etbs_tadwira_contributions', state.tadwiraContributions);
    syncPushInBackground();
    render();
  },

  async exportData() {
    const payload = {
      exportedAt: new Date().toISOString(),
      transactions: state.transactions,
      adjustments: state.adjustments,
      opportunities: state.opportunities,
      notes: state.notes,
      generalNotes: state.generalNotes,
      payables: state.payables,
      members: state.members,
      feeEvents: state.feeEvents,
      feeParticipants: state.feeParticipants,
      boardMembers: state.boardMembers,
      tadwiras: state.tadwiras,
      tadwiraContributions: state.tadwiraContributions,
    };
    let fileObj, filenameSuffix = '';
    if (CRYPTO_OK) {
      const pin = await askPin({ title: 'Protect this backup', subtitle: "Choose a numeric password for this file. Give it to whoever imports it — send it a different way than the file itself, e.g. by text.", confirmLabel: 'Encrypt & download' });
      if (pin === null) return;
      const enc = await encryptWithPin(pin, JSON.stringify(payload));
      fileObj = { etbsBackup: true, version: 1, ...enc };
    } else {
      fileObj = payload;
      filenameSuffix = '-unencrypted';
      alert("This browser context can't encrypt the backup, so it will download as plain (unprotected) JSON instead.");
    }
    const blob = new Blob([JSON.stringify(fileObj)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `enactus-tbs-treasury-backup-${todayISO()}${filenameSuffix}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      let fileObj;
      try { fileObj = JSON.parse(reader.result); }
      catch (err) { alert('Could not read that file — is it a valid backup export?'); e.target.value = ''; return; }

      let data;
      if (fileObj && fileObj.etbsBackup) {
        if (!CRYPTO_OK) { alert("This backup is encrypted, but this browser context can't decrypt it. Try opening the app directly in Chrome or Safari."); e.target.value = ''; return; }
        const pin = await askPin({ title: 'Enter the backup password', subtitle: 'Ask whoever sent you this file for the number.', confirmLabel: 'Unlock & import' });
        if (pin === null) { e.target.value = ''; return; }
        try {
          data = JSON.parse(await decryptWithPin(pin, fileObj));
        } catch (err) {
          alert('Wrong password, or the file is damaged. Nothing on this device was changed.');
          e.target.value = ''; return;
        }
      } else if (fileObj && (Array.isArray(fileObj.transactions) || fileObj.adjustments)) {
        data = fileObj; // older, unencrypted backup — still supported
      } else {
        alert("This doesn't look like a treasury backup file.");
        e.target.value = ''; return;
      }

      if (!confirm('This will replace the data currently on this device with the imported backup. Continue?')) { e.target.value = ''; return; }
      if (Array.isArray(data.transactions)) { state.transactions = data.transactions; saveJSON('etbs_transactions', state.transactions); }
      if (data.adjustments) { state.adjustments = data.adjustments; saveJSON('etbs_adjustments', state.adjustments); }
      if (Array.isArray(data.opportunities)) { state.opportunities = data.opportunities; saveJSON('etbs_opportunities', state.opportunities); }
      if (Array.isArray(data.notes)) { state.notes = data.notes; saveJSON('etbs_notes', state.notes); }
      if (Array.isArray(data.generalNotes)) { state.generalNotes = data.generalNotes; saveJSON('etbs_general_notes', state.generalNotes); }
      if (Array.isArray(data.payables)) { state.payables = data.payables; saveJSON('etbs_payables', state.payables); }
      if (Array.isArray(data.members)) { state.members = data.members; saveJSON('etbs_members', state.members); }
      if (Array.isArray(data.feeEvents)) { state.feeEvents = data.feeEvents; saveJSON('etbs_fee_events', state.feeEvents); }
      if (Array.isArray(data.feeParticipants)) { state.feeParticipants = data.feeParticipants; saveJSON('etbs_fee_participants', state.feeParticipants); }
      if (Array.isArray(data.boardMembers)) { state.boardMembers = data.boardMembers; saveJSON('etbs_board_members', state.boardMembers); }
      if (Array.isArray(data.tadwiras)) { state.tadwiras = data.tadwiras; saveJSON('etbs_tadwiras', state.tadwiras); }
      if (Array.isArray(data.tadwiraContributions)) { state.tadwiraContributions = data.tadwiraContributions; saveJSON('etbs_tadwira_contributions', state.tadwiraContributions); }
      syncPushInBackground();
      render();
      alert('Import complete.');
      e.target.value = '';
    };
    reader.readAsText(file);
  },

  resetAll() {
    const syncNote = syncReady() ? ' This device is connected to cloud sync — resetting here will NOT touch the shared Google Sheet, and the next sync will pull the sheet\'s data back down.' : '';
    if (!confirm('This clears all balances, transactions, opportunities and notes stored on THIS device. Export a backup first if you want to keep a copy.' + syncNote + ' Continue?')) return;
    ['etbs_transactions','etbs_adjustments','etbs_opportunities','etbs_notes','etbs_general_notes','etbs_payables','etbs_members','etbs_fee_events','etbs_fee_participants','etbs_board_members','etbs_tadwiras','etbs_tadwira_contributions','etbs_logged_by'].forEach(k => localStorage.removeItem(k));
    loadAll();
    render();
  },

  toggleKeyEdit() { state.ui.editingKey = !state.ui.editingKey; render(); },
  saveGeminiKey(e) {
    e.preventDefault();
    const key = e.target.geminiKey.value.trim();
    if (!key) return;
    state.geminiKey = key;
    localStorage.setItem('etbs_gemini_key', key);
    state.ui.editingKey = false;
    render();
  },
  clearGeminiKey() {
    if (!confirm('Remove the saved Gemini key from this device?')) return;
    state.geminiKey = '';
    localStorage.removeItem('etbs_gemini_key');
    render();
  },

  startEditChatMsg(idx) { state.ui.editingChatIndex = idx; render(); },
  cancelEditChatMsg() { state.ui.editingChatIndex = null; render(); },
  submitEditChatMsg(e, idx) {
    e.preventDefault();
    const newText = e.target.msg.value.trim();
    if (!newText) return;
    // Drop this message and everything that came after it — the reply and any
    // follow-ups were based on the old wording, so they no longer apply.
    state.chatMessages = state.chatMessages.slice(0, idx);
    state.ui.editingChatIndex = null;
    App.sendChat(newText);
  },

  async sendChat(text) {
    const msg = (text || '').trim();
    if (!msg || state.chatLoading || !state.geminiKey) return;
    state.chatMessages.push({ role: 'user', content: msg });
    state.chatLoading = true;
    render();

    try {
      const b = balances();
      const total = b.carte_bancaire + b.d17 + b.cash;
      const accLines = ACCOUNTS.map(a => `- ${a.label}: ${fmtDT(b[a.id]||0)}`).join('\n');
      const recent = state.transactions.slice(0,12).map(t => {
        if (t.type === 'transfer') return `${t.date} | transfer | ${t.fromAccount} -> ${t.toAccount} | ${fmtDT(t.amount)}`;
        return `${t.date} | ${t.type} | ${t.account} | ${t.category} | ${fmtDT(t.amount)}${t.note ? ' | '+t.note : ''}`;
      }).join('\n') || '(none logged yet)';
      const opps = state.opportunities.map(o => `${o.name} — ${o.type} — status: ${o.status}${o.deadline ? ' — deadline '+o.deadline : ''}${o.notes ? ' — '+o.notes : ''}`).join('\n') || '(none logged yet)';
      const noteLines = state.notes.map(n => `${n.title}: ${n.content}`).join('\n') || '(none)';

      const systemPrompt = `You are the treasury assistant built into Enactus TBS's internal treasury app — a knowledgeable, finance-literate advisor for the Financial Officer (FO) and future FOs. Enactus is a global non-profit network where university students run entrepreneurial projects with social and environmental impact; Enactus TBS is the chapter at Tunis Business School in Tunisia. You help with the club's finances, funding opportunities, budgeting, sponsorship strategy, and handover knowledge.

Be genuinely helpful and substantive: reason things through, explain your thinking, offer concrete suggestions and next steps, and bring in relevant financial/non-profit knowledge the user may not have. When a question is open-ended (e.g. "what funding could we pursue?"), give a thoughtful, structured answer rather than a one-liner. When it's a simple data lookup (e.g. "what's our D17 balance?"), answer directly and briefly.

Known organizational constraints, always keep these in mind:
- Enactus TBS has no legal personality, so the club cannot hold funds or sign contracts as itself.
- Grants legally belong to the project holder who won them, not to the club.
- Enactus Tunisia takes a 10% fee on flows that go through the bank — factor this into any projection of what a grant or sponsorship actually nets.

Current data snapshot from the app:
TOTAL BALANCE: ${fmtDT(total)}
BY ACCOUNT:
${accLines}

RECENT TRANSACTIONS (most recent first):
${recent}

FINANCIAL OPPORTUNITIES:
${opps}

HANDOVER NOTES:
${noteLines}

For any specific figures, trust the data above — it's computed from the real ledger. Reply in the same language the user writes in (they may use English, French, or Arabic). You may use **bold** and simple "- " bullet lists for clarity; the app renders them. If something genuinely isn't in the data, say so rather than inventing it.`;

      const contents = state.chatMessages.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
      const reqBody = JSON.stringify({ systemInstruction: { parts: [{ text: systemPrompt }] }, contents });

      // Try stronger models first for smarter answers, falling back to faster ones if a
      // model is retired or unavailable. Remembers whichever works.
      const MODEL_CANDIDATES = ['gemini-3.6-pro', 'gemini-pro-latest', 'gemini-3.6-flash', 'gemini-flash-latest', 'gemini-2.5-flash'];
      const savedModel = localStorage.getItem('etbs_gemini_model');
      const modelsToTry = (savedModel && MODEL_CANDIDATES.includes(savedModel)) ? [savedModel, ...MODEL_CANDIDATES.filter(m => m !== savedModel)] : MODEL_CANDIDATES;

      let data = null, lastErr = null;
      for (const model of modelsToTry) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 40000);
        let res;
        try {
          res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(state.geminiKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: reqBody,
            signal: controller.signal,
          });
        } finally {
          clearTimeout(timeoutId);
        }
        const json = await res.json();
        if (json.error) {
          const m = (json.error.message || '').toLowerCase();
          // model-not-available style errors → try the next candidate
          if (m.includes('no longer available') || m.includes('not found') || m.includes('is not supported') || json.error.code === 404) {
            lastErr = new Error(json.error.message);
            continue;
          }
          // any other error (quota, bad key, etc.) is real — stop and report it
          throw new Error(json.error.message || 'Gemini API error');
        }
        localStorage.setItem('etbs_gemini_model', model);
        data = json;
        break;
      }
      if (!data) throw (lastErr || new Error('No available Gemini model responded.'));

      const replyText = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || [])
        .map(p => p.text).join('') || "I couldn't generate a response — try rephrasing.";
      state.chatMessages.push({ role: 'assistant', content: replyText });
    } catch (err) {
      console.error('sendChat failed', err);
      const errMsg = (err && err.name === 'AbortError') ? 'the response took too long (over 40 seconds) — Gemini can be slow on the free tier, try asking again' : ((err && err.message) || 'unknown error');
      state.chatMessages.push({ role: 'assistant', content: `Couldn't reach Gemini: ${errMsg}. Check your key, your connection, or try again in a bit (free tier has a request limit).` });
    } finally {
      state.chatLoading = false;
      render();
    }
  },
};

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(t =>
    `<button class="tab ${state.activeTab === t.id ? 'active' : ''}" onclick="App.setTab('${t.id}')">${t.label}</button>`
  ).join('');
}

function renderDashboard() {
  const b = balances();
  const total = b.carte_bancaire + b.d17 + b.cash;
  const thisMonthKey = todayISO().slice(0, 7);
  const thisMonthTx = state.transactions.filter(t => t.date && t.date.slice(0, 7) === thisMonthKey);
  const monthIn = thisMonthTx.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0);
  const monthOut = thisMonthTx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);
  const netMonth = monthIn - monthOut;

  const months = lastNMonths(6);
  const monthly = months.map(m => {
    const txs = state.transactions.filter(t => t.date && t.date.slice(0, 7) === m.key);
    return {
      label: m.label,
      income: txs.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0),
      expense: txs.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0),
    };
  });
  const maxMonthly = Math.max(1, ...monthly.flatMap(m => [m.income, m.expense]));

  const expByCat = categoryTotals('expense').slice(0, 6);
  const incByCat = categoryTotals('income').slice(0, 6);
  const maxExp = Math.max(1, ...expByCat.map(([, v]) => v));
  const maxInc = Math.max(1, ...incByCat.map(([, v]) => v));

  function catBars(entries, max, color, emptyMsg) {
    if (entries.length === 0) return `<div class="empty">${emptyMsg}</div>`;
    return entries.map(([cat, amt]) => `
      <div class="catbar-row">
        <div class="catbar-label">${esc(cat)}</div>
        <div class="catbar-track"><div class="catbar-fill" style="width:${(amt/max)*100}%;background:${color};"></div></div>
        <div class="catbar-amt mono">${fmtDT(amt)}</div>
      </div>`).join('');
  }

  return `
    <div class="stat-grid">
      <div class="card stat-card"><div class="stat-label">TOTAL TREASURY</div><div class="stat-value mono">${fmtDT(total)}</div></div>
      <div class="card stat-card"><div class="stat-label">THIS MONTH IN</div><div class="stat-value mono" style="color:var(--green)">${fmtDT(monthIn)}</div></div>
      <div class="card stat-card"><div class="stat-label">THIS MONTH OUT</div><div class="stat-value mono" style="color:var(--red)">${fmtDT(monthOut)}</div></div>
      <div class="card stat-card"><div class="stat-label">NET THIS MONTH</div><div class="stat-value mono" style="color:${netMonth>=0?'var(--green)':'var(--red)'}">${fmtDT(netMonth)}</div></div>
    </div>

    <div class="section-title">Income vs expense — last 6 months</div>
    <div class="card" style="margin-bottom:18px;">
      <div class="bar-chart">
        ${monthly.map(m => `
          <div class="bar-chart-col">
            <div class="bar-chart-bars">
              <div class="bar-chart-bar" style="height:${Math.max(2,(m.income/maxMonthly)*100)}%;background:var(--green);" title="Income ${fmtDT(m.income)}"></div>
              <div class="bar-chart-bar" style="height:${Math.max(2,(m.expense/maxMonthly)*100)}%;background:var(--red);" title="Expense ${fmtDT(m.expense)}"></div>
            </div>
            <div class="bar-chart-label">${m.label}</div>
          </div>`).join('')}
      </div>
      <div class="chart-legend"><span><i style="background:var(--green)"></i>Income</span><span><i style="background:var(--red)"></i>Expense</span></div>
    </div>

    <div class="section-title">Expenses by category</div>
    <div class="card" style="margin-bottom:18px;">${catBars(expByCat, maxExp, 'var(--red)', 'No expenses logged yet.')}</div>

    <div class="section-title">Income by category</div>
    <div class="card" style="margin-bottom:18px;">${catBars(incByCat, maxInc, 'var(--green)', 'No income logged yet.')}</div>

    <div class="section-title">Accounts</div>
    <div class="card">
      ${ACCOUNTS.map(a => {
        const val = b[a.id] || 0;
        const pct = total !== 0 ? Math.max(0, (val/total)*100) : 0;
        return `
        <div class="catbar-row">
          <div class="catbar-label">${a.label}</div>
          <div class="catbar-track"><div class="catbar-fill" style="width:${pct}%;background:${a.color};"></div></div>
          <div class="catbar-amt mono">${fmtDT(val)}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function renderTreasury() {
  const b = balances();
  const total = b.carte_bancaire + b.d17 + b.cash;
  const maxBal = Math.max(1, ...ACCOUNTS.map(a => Math.abs(b[a.id] || 0)));

  const accountCards = ACCOUNTS.map(a => {
    const val = b[a.id] || 0;
    const pct = Math.min(100, (Math.abs(val) / maxBal) * 100);
    const editing = state.ui.editingAccount === a.id;
    return `
      <div class="acct-card">
        <div class="acct-top">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="acct-avatar" style="background:${a.color}">${a.short}</div>
            <div class="acct-name">${a.label}</div>
          </div>
          ${!editing ? `<button class="icon-btn" title="Correct balance" onclick="App.startEditAccount('${a.id}')">${svg('pencil',13)}</button>` : ''}
        </div>
        ${editing ? `
          <form class="row" style="margin-bottom:8px;" onsubmit="App.submitAccountEdit(event,'${a.id}')">
            <input name="value" type="number" step="0.001" autofocus value="${val.toFixed(3)}" style="font-weight:700;">
            <button type="submit" class="btn btn-primary" style="flex:0 0 auto;padding:9px 12px;">Set</button>
            <button type="button" class="btn" style="flex:0 0 auto;padding:9px 10px;" onclick="App.cancelEditAccount()">${svg('x',13)}</button>
          </form>
        ` : `<div class="acct-value mono">${fmtDT(val)}</div>`}
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${a.color}"></div></div>
      </div>`;
  }).join('');

  const filtered = state.transactions.filter(t => {
    if (state.ui.filterAccount !== 'all') {
      if (t.type === 'transfer') {
        if (t.fromAccount !== state.ui.filterAccount && t.toAccount !== state.ui.filterAccount) return false;
      } else if (t.account !== state.ui.filterAccount) return false;
    }
    if (state.ui.filterType !== 'all' && t.type !== state.ui.filterType) return false;
    if (state.ui.search) {
      const hay = t.type === 'transfer'
        ? `transfer ${ACCOUNTS.find(a=>a.id===t.fromAccount)?.label||''} ${ACCOUNTS.find(a=>a.id===t.toAccount)?.label||''} ${t.note||''}`
        : `${t.category||''} ${t.note||''}`;
      if (!hay.toLowerCase().includes(state.ui.search.toLowerCase())) return false;
    }
    return true;
  });

  const txRows = filtered.length === 0
    ? `<div class="empty">No entries yet. Add the first income, expense or transfer above.</div>`
    : filtered.map(t => {
        if (state.ui.editingTxId === t.id) {
          return `<div class="tx-row" style="display:block;">${renderTxEditForm(t.id)}</div>`;
        }
        if (t.type === 'transfer') {
          const fromAcc = ACCOUNTS.find(a => a.id === t.fromAccount);
          const toAcc = ACCOUNTS.find(a => a.id === t.toAccount);
          const metaBits = [t.loggedBy, t.note].filter(Boolean).join(' · ');
          return `
          <div class="tx-row">
            ${txDateCell(t)}
            <div class="tx-main">
              <div class="tx-cat">${fromAcc ? fromAcc.label : t.fromAccount} → ${toAcc ? toAcc.label : t.toAccount}</div>
              <div class="tx-meta">${esc(metaBits)}</div>
            </div>
            <div class="tx-amt mono" style="color:var(--blue)">
              ${svg('swap', 12)}${fmtDT(t.amount)}
            </div>
            <button class="icon-btn" onclick="App.startEditTx('${t.id}')">${svg('pencil',13)}</button>
            <button class="icon-btn" onclick="App.deleteTx('${t.id}')">${svg('trash',13)}</button>
          </div>`;
        }
        const acc = ACCOUNTS.find(a => a.id === t.account);
        const metaBits = [acc ? acc.label : t.account, t.loggedBy, t.note].filter(Boolean).join(' · ');
        return `
        <div class="tx-row">
          ${txDateCell(t)}
          <div class="tx-main">
            <div class="tx-cat">${esc(t.category)}</div>
            <div class="tx-meta">${esc(metaBits)}</div>
          </div>
          <div class="tx-amt mono" style="color:${t.type==='income' ? 'var(--green)' : 'var(--red)'}">
            ${svg(t.type==='income' ? 'up' : 'down', 12)}${t.type==='income' ? '+' : '-'}${fmtDT(t.amount)}
          </div>
          <button class="icon-btn" onclick="App.startEditTx('${t.id}')">${svg('pencil',13)}</button>
          <button class="icon-btn" onclick="App.deleteTx('${t.id}')">${svg('trash',13)}</button>
        </div>`;
      }).join('');

  return `
    <div class="hero-card">
      <div class="hero-label">TOTAL TREASURY</div>
      <div class="hero-value mono">${fmtDT(total)}</div>
    </div>
    <div class="acct-grid">${accountCards}</div>

    <button class="btn ${state.ui.showTxForm ? 'btn-primary' : ''}" onclick="App.toggleTxForm()">${svg('plus',14)} Add income / expense / transfer</button>
    ${state.ui.showTxForm ? `
      <form class="card panel" onsubmit="App.submitTx(event)">
        <div class="seg">
          <button type="button" class="${state.ui.txType==='expense'?'active-expense':''}" onclick="App.setTxType('expense', this)">Expense</button>
          <button type="button" class="${state.ui.txType==='income'?'active-income':''}" onclick="App.setTxType('income', this)">Income</button>
          <button type="button" class="${state.ui.txType==='transfer'?'active-transfer':''}" onclick="App.setTxType('transfer', this)">Transfer</button>
        </div>
        <div id="tx-type-fields">${renderTxTypeFields()}</div>
        <div class="row">
          <input name="amount" type="number" step="0.001" min="0" placeholder="Amount (DT)">
          <input name="date" type="date" value="${todayISO()}">
          <input name="time" type="time" value="${nowHHMM()}">
        </div>
        <div class="muted" style="font-size:11px;margin:-6px 2px 10px;">Time is optional — clear it if you don't need it.</div>
        <div class="row"><textarea name="note" rows="2" placeholder="Note (optional)"></textarea></div>
        <div class="row"><input name="loggedBy" placeholder="Logged by (your name)" value="${esc(state.loggedBy)}"></div>
        <button type="submit" class="btn btn-primary">Save entry</button>
      </form>
    ` : ''}

    <div class="section-title">${svg('wallet',15)} Transactions</div>
    <div class="row" style="margin-bottom:10px;">
      <select onchange="App.setFilterAccount(this.value)">
        <option value="all">All accounts</option>
        ${ACCOUNTS.map(a=>`<option value="${a.id}" ${state.ui.filterAccount===a.id?'selected':''}>${a.label}</option>`).join('')}
      </select>
      <select onchange="App.setFilterType(this.value)">
        <option value="all">All types</option>
        <option value="income" ${state.ui.filterType==='income'?'selected':''}>Income</option>
        <option value="expense" ${state.ui.filterType==='expense'?'selected':''}>Expense</option>
        <option value="transfer" ${state.ui.filterType==='transfer'?'selected':''}>Transfer</option>
      </select>
      <input id="search-input" placeholder="Search…" value="${esc(state.ui.search)}" oninput="App.setSearch(this)">
    </div>
    <div class="card" style="padding:6px 12px;">${txRows}</div>
  `;
}

function renderOpportunities() {
  const sorted = [...state.opportunities].sort((a,b) => {
    if (!a.deadline && !b.deadline) return 0;
    if (!a.deadline) return 1;
    if (!b.deadline) return -1;
    return new Date(a.deadline) - new Date(b.deadline);
  });
  const list = sorted.length === 0 ? `<div class="empty">No opportunities logged yet.</div>` : sorted.map(o => {
    const dLeft = daysUntil(o.deadline);
    const urgent = dLeft !== null && dLeft >= 0 && dLeft <= 30 && o.status !== 'Won' && o.status !== 'Rejected';
    return `
      <div class="card opp-card" style="${urgent ? 'border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);' : ''}">
        <div style="display:flex;justify-content:space-between;gap:10px;">
          <div style="min-width:0;">
            <div class="opp-name">${esc(o.name)}</div>
            <div class="opp-tags">
              <span class="pill">${esc(o.type)}</span>
              <span class="pill" style="color:${STATUS_COLOR[o.status]};border-color:${STATUS_COLOR[o.status]}">${esc(o.status)}</span>
              ${o.deadline ? `<span class="muted mono" style="font-size:11px;">Deadline ${fmtDate(o.deadline)}${dLeft!==null? ` (${dLeft>=0?dLeft+'d left':'past'})` : ''}</span>` : ''}
            </div>
            ${o.notes ? `<div class="opp-notes">${esc(o.notes)}</div>` : ''}
            ${o.link ? `<a href="${esc(o.link)}" target="_blank" rel="noreferrer" style="font-size:12px;color:var(--gold-deep);display:inline-flex;align-items:center;gap:3px;margin-top:6px;">Open link ${svg('ext',11)}</a>` : ''}
          </div>
          <button class="icon-btn" onclick="App.deleteOpp('${o.id}')">${svg('trash',13)}</button>
        </div>
        <div class="status-row">
          ${OPP_STATUSES.map(s => `<button class="${o.status===s?'active':''}" onclick="App.setOppStatus('${o.id}','${s}')">${s}</button>`).join('')}
        </div>
      </div>`;
  }).join('');

  return `
    <button class="btn ${state.ui.showOppForm?'btn-primary':''}" onclick="App.toggleOppForm()">${svg('plus',14)} Add opportunity</button>
    ${state.ui.showOppForm ? `
      <form class="card panel" onsubmit="App.submitOpp(event)">
        <div class="row"><input name="name" placeholder="Name (e.g. H&M Global Change Award)"></div>
        <div class="row">
          <select name="type">${OPP_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
          <select name="status">${OPP_STATUSES.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
        </div>
        <div class="row">
          <input name="deadline" type="date">
          <input name="link" placeholder="Link (optional)">
        </div>
        <div class="row"><textarea name="notes" rows="2" placeholder="Notes — fit, requirements, contacts…"></textarea></div>
        <button type="submit" class="btn btn-primary">Save opportunity</button>
      </form>
    ` : ''}
    <div style="margin-top:16px;">${list}</div>
  `;
}

function noteAccordionList(notes, openId, toggleFn, deleteFn) {
  if (notes.length === 0) return `<div class="empty">No notes yet.</div>`;
  return notes.map(n => {
    const open = openId === n.id;
    return `
      <div class="card note-card">
        <div class="note-head" onclick="App.${toggleFn}('${n.id}')">
          <div>
            <div class="note-title">${esc(n.title)}</div>
            <div class="note-date">${fmtDate(n.date)}</div>
          </div>
          <span style="transform:rotate(${open?180:0}deg);transition:transform .15s;">${svg('chevron',16)}</span>
        </div>
        ${open ? `
          <div class="note-body">${esc(n.content)}</div>
          <button class="btn btn-ghost" style="margin-top:8px;padding:0;font-size:11.5px;color:var(--red);" onclick="App.${deleteFn}('${n.id}')">${svg('trash',12)} Delete note</button>
        ` : ''}
      </div>`;
  }).join('');
}
