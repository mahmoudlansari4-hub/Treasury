function renderApAr() {
  const b = balances();
  const total = b.carte_bancaire + b.d17 + b.cash;
  const pending = state.payables.filter(p => p.status === 'pending');
  const totalPayable = pending.filter(p => p.kind === 'payable').reduce((s, p) => s + Number(p.amount || 0), 0);
  const totalReceivable = pending.filter(p => p.kind === 'receivable').reduce((s, p) => s + Number(p.amount || 0), 0);
  const projected = total - totalPayable + totalReceivable;

  const sorted = [...state.payables].sort((a, b) => {
    if (a.status !== b.status) return a.status === 'pending' ? -1 : 1;
    if (!a.dueDate && !b.dueDate) return 0;
    if (!a.dueDate) return 1;
    if (!b.dueDate) return -1;
    return new Date(a.dueDate) - new Date(b.dueDate);
  });

  const list = sorted.length === 0 ? `<div class="empty">Nothing logged yet.</div>` : sorted.map(p => {
    if (state.ui.editingApArId === p.id) {
      const d = state.ui.editApAr;
      return `
        <div class="card panel" style="margin-bottom:10px;">
          <div class="seg" style="margin-bottom:10px;">
            <button type="button" class="${d.kind==='payable'?'active-expense':''}" onclick="App.setEditApArKind('payable', this)">We owe (payable)</button>
            <button type="button" class="${d.kind==='receivable'?'active-income':''}" onclick="App.setEditApArKind('receivable', this)">Owed to us (receivable)</button>
          </div>
          <form onsubmit="App.submitEditApAr(event,'${p.id}')">
            <div class="row"><input name="description" value="${esc(d.description)}" placeholder="What's this for?"></div>
            <div class="row"><input name="counterparty" value="${esc(d.counterparty||'')}" placeholder="Who (optional)"></div>
            <div class="row">
              <input name="amount" type="number" step="0.001" min="0" value="${d.amount}">
              <input name="dueDate" type="date" value="${d.dueDate||''}">
            </div>
            <div class="field-label">EXPECTED ACCOUNT</div>
            <div class="acct-pick">
              ${ACCOUNTS.map(a => `<button type="button" class="${d.account===a.id?'active':''}" onclick="App.setEditApArAccount('${a.id}', this)">${a.label}</button>`).join('')}
            </div>
            <div style="display:flex;gap:8px;">
              <button type="submit" class="btn btn-primary">Save changes</button>
              <button type="button" class="btn" onclick="App.cancelEditApAr()">Cancel</button>
            </div>
          </form>
        </div>`;
    }
    const acc = ACCOUNTS.find(a => a.id === p.account);
    const dLeft = daysUntil(p.dueDate);
    const overdue = p.status === 'pending' && dLeft !== null && dLeft < 0;
    const settling = state.ui.settlingApArId === p.id;
    const settleAcct = state.ui.settleApArAccount || p.account;
    return `
      <div class="card opp-card" style="${overdue ? 'border-color:var(--red);box-shadow:0 0 0 1px var(--red);' : ''}">
        <div style="display:flex;justify-content:space-between;gap:10px;">
          <div style="min-width:0;">
            <div class="opp-name">${esc(p.description)}</div>
            <div class="opp-tags">
              <span class="pill" style="color:${p.kind === 'payable' ? 'var(--red)' : 'var(--green)'};border-color:${p.kind === 'payable' ? 'var(--red)' : 'var(--green)'}">${p.kind === 'payable' ? 'Payable' : 'Receivable'}</span>
              <span class="pill" style="color:${p.status === 'settled' ? 'var(--green)' : 'var(--muted)'}">${p.status === 'settled' ? 'Settled' : 'Pending'}</span>
              ${acc ? `<span class="pill">${acc.label}</span>` : ''}
              ${p.dueDate ? `<span class="muted mono" style="font-size:11px;">Due ${fmtDate(p.dueDate)}${dLeft !== null && p.status === 'pending' ? ` (${dLeft >= 0 ? dLeft + 'd left' : 'overdue'})` : ''}</span>` : ''}
            </div>
            ${p.counterparty ? `<div class="opp-notes">${esc(p.counterparty)}</div>` : ''}
            <div class="mono" style="font-size:13px;font-weight:700;margin-top:4px;">${fmtDT(p.amount)}</div>
            ${p.status === 'settled' ? `<div class="muted" style="font-size:11px;margin-top:4px;">Settled ${fmtDate(p.settledDate)}</div>` : ''}
          </div>
          <div style="display:flex;gap:2px;flex-shrink:0;">
            ${p.status === 'pending' ? `<button class="icon-btn" onclick="App.startEditApAr('${p.id}')">${svg('pencil', 13)}</button>` : ''}
            <button class="icon-btn" onclick="App.deleteApAr('${p.id}')">${svg('trash', 13)}</button>
          </div>
        </div>
        ${p.status === 'pending' ? `
          <div style="margin-top:10px;">
            <button class="btn ${settling ? 'btn-primary' : ''}" style="font-size:12px;padding:6px 10px;" onclick="App.toggleSettleApAr('${p.id}')">
              ${p.kind === 'payable' ? 'Mark as paid' : 'Mark as received'}
            </button>
            ${settling ? `
              <form onsubmit="App.confirmSettleApAr(event,'${p.id}')" style="margin-top:10px;">
                <div class="field-label">${p.kind === 'payable' ? 'PAY FROM' : 'RECEIVE INTO'}</div>
                <div class="acct-pick">
                  ${ACCOUNTS.map(a => `<button type="button" class="${settleAcct === a.id ? 'active' : ''}" onclick="App.setSettleApArAccount('${a.id}', this)">${a.label}</button>`).join('')}
                </div>
                <div class="row"><input name="date" type="date" value="${todayISO()}"></div>
                <button type="submit" class="btn btn-primary" style="font-size:12px;">Confirm &amp; record transaction</button>
              </form>
            ` : ''}
          </div>
        ` : ''}
      </div>`;
  }).join('');

  return `
    <div class="stat-grid">
      <div class="card stat-card"><div class="stat-label">CURRENT TREASURY</div><div class="stat-value mono">${fmtDT(total)}</div></div>
      <div class="card stat-card"><div class="stat-label">PENDING RECEIVABLE</div><div class="stat-value mono" style="color:var(--green)">${fmtDT(totalReceivable)}</div></div>
      <div class="card stat-card"><div class="stat-label">PENDING PAYABLE</div><div class="stat-value mono" style="color:var(--red)">${fmtDT(totalPayable)}</div></div>
      <div class="card stat-card"><div class="stat-label">PROJECTED AFTER SETTLING</div><div class="stat-value mono" style="color:${projected >= total ? 'var(--green)' : 'var(--red)'}">${fmtDT(projected)}</div></div>
    </div>

    <button class="btn ${state.ui.showApArForm ? 'btn-primary' : ''}" onclick="App.toggleApArForm()">${svg('plus', 14)} Add payable / receivable</button>
    ${state.ui.showApArForm ? `
      <form class="card panel" onsubmit="App.submitApAr(event)">
        <div class="seg">
          <button type="button" class="${state.ui.apArKind === 'payable' ? 'active-expense' : ''}" onclick="App.setApArKind('payable', this)">We owe (payable)</button>
          <button type="button" class="${state.ui.apArKind === 'receivable' ? 'active-income' : ''}" onclick="App.setApArKind('receivable', this)">Owed to us (receivable)</button>
        </div>
        <div class="row"><input name="description" placeholder="What's this for? (e.g. Printing invoice)"></div>
        <div class="row"><input name="counterparty" placeholder="Who (optional) — vendor, sponsor, member…"></div>
        <div class="row">
          <input name="amount" type="number" step="0.001" min="0" placeholder="Amount (DT)">
          <input name="dueDate" type="date">
        </div>
        <div class="field-label">EXPECTED ACCOUNT</div>
        <div class="acct-pick">
          ${ACCOUNTS.map(a => `<button type="button" class="${state.ui.apArAccount === a.id ? 'active' : ''}" onclick="App.setApArAccount('${a.id}', this)">${a.label}</button>`).join('')}
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
    ` : ''}

    <div style="margin-top:16px;">${list}</div>
  `;
}

function renderMembers() {
  const totalMembers = state.members.length;
  let totalCollected = 0, totalOutstanding = 0;
  state.feeParticipants.forEach(p => {
    if (p.status === 'paid') totalCollected += Number(p.amount || 0);
    else totalOutstanding += Number(p.amount || 0);
  });

  const rosterChips = state.members.length === 0 ? `<div class="empty">No members yet.</div>` : `
    <div style="display:flex;flex-wrap:wrap;gap:8px;">
      ${state.members.map(m => `
        <span class="pill" style="padding:5px 6px 5px 5px;display:inline-flex;align-items:center;gap:6px;">
          <span class="member-avatar" style="width:20px;height:20px;font-size:8.5px;background:${avatarColor(m.name)}">${initials(m.name)}</span>
          ${esc(m.name)}
          <button class="icon-btn" style="padding:0;" onclick="App.deleteMember('${m.id}')">${svg('x', 11)}</button>
        </span>
      `).join('')}
    </div>`;

  const events = state.feeEvents.length === 0 ? `<div class="empty">No fee events yet.</div>` : state.feeEvents.map(ev => {
    const open = state.ui.openFeeEventId === ev.id;
    const participants = state.feeParticipants.filter(p => p.eventId === ev.id);
    const paidCount = participants.filter(p => p.status === 'paid').length;
    const totalCount = participants.length;
    const ratioColor = totalCount === 0 ? 'var(--muted)' : (paidCount === totalCount ? 'var(--green)' : (paidCount === 0 ? 'var(--red)' : 'var(--gold-deep)'));
    const evAcc = ACCOUNTS.find(a => a.id === ev.account);
    const addingRoster = state.ui.addingParticipantsFor === ev.id;
    const addingCustom = state.ui.addingCustomNameFor === ev.id;

    const participantRows = participants.length === 0 ? `<div class="empty">Nobody added yet — pick from the roster or add a name below.</div>` : participants.map(p => {
      const name = p.memberId ? ((state.members.find(m => m.id === p.memberId) || {}).name || 'Member') : (p.customName || 'Guest');
      const isPaid = p.status === 'paid';
      return `
        <div class="fee-row">
          <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
            <span class="member-avatar" style="width:24px;height:24px;font-size:9.5px;background:${avatarColor(name)}">${initials(name)}</span>
            <div style="min-width:0;">
              <div class="fee-label">${esc(name)}</div>
              ${isPaid ? `<div class="muted" style="font-size:10px;">Paid ${fmtDate(p.paidDate)}</div>` : ''}
            </div>
          </div>
          ${isPaid
            ? `<div class="mono" style="font-size:12.5px;font-weight:700;margin-right:4px;">${fmtDT(p.amount)}</div>`
            : `<input type="number" step="0.001" min="0" class="fee-amount-input" value="${p.amount}" onchange="App.setParticipantAmount('${p.id}', this.value)">`
          }
          <button class="toggle-pill ${isPaid ? 'paid' : 'unpaid'}" onclick="App.togglePaid('${p.id}')">${isPaid ? 'Paid' : 'Unpaid'}</button>
          <button class="icon-btn" onclick="App.removeParticipant('${p.id}')">${svg('x', 13)}</button>
        </div>`;
    }).join('');

    const rosterTickList = state.members.length === 0 ? `<div class="muted" style="font-size:12px;padding:6px 2px;">No members in the roster yet.</div>` : state.members.map(m => {
      const existing = participants.find(p => p.memberId === m.id);
      const isPaidAlready = existing && existing.status === 'paid';
      return `
        <label class="tick-row">
          <input type="checkbox" ${existing ? 'checked' : ''} ${isPaidAlready ? 'disabled' : ''} onchange="App.toggleParticipantFromRoster('${ev.id}','${m.id}', this.checked)">
          <span class="member-avatar" style="width:20px;height:20px;font-size:8.5px;background:${avatarColor(m.name)}">${initials(m.name)}</span>
          ${esc(m.name)}
          ${isPaidAlready ? `<span class="muted" style="font-size:10px;margin-left:auto;">already paid</span>` : ''}
        </label>`;
    }).join('');

    return `
      <div class="card member-card" style="margin-bottom:10px;">
        <div class="note-head" onclick="App.toggleFeeEventOpen('${ev.id}')">
          <div>
            <div class="note-title">${esc(ev.name)}</div>
            <div class="mono" style="font-size:11px;color:${ratioColor};font-weight:700;">${paidCount}/${totalCount} paid · ${fmtDT(ev.amount)} suggested · into ${evAcc ? evAcc.label : ev.account}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <button class="icon-btn" onclick="event.stopPropagation(); App.deleteFeeEvent('${ev.id}')">${svg('trash', 13)}</button>
            <span style="transform:rotate(${open ? 180 : 0}deg);transition:transform .15s;">${svg('chevron', 16)}</span>
          </div>
        </div>
        ${open ? `
          <div style="margin-top:12px;">${participantRows}</div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
            <button class="btn ${addingRoster ? 'btn-primary' : ''}" style="font-size:11.5px;padding:5px 10px;" onclick="App.toggleAddParticipants('${ev.id}')">${svg('plus', 12)} Add from roster</button>
            <button class="btn ${addingCustom ? 'btn-primary' : ''}" style="font-size:11.5px;padding:5px 10px;" onclick="App.toggleAddCustomName('${ev.id}')">${svg('plus', 12)} Add name</button>
          </div>

          ${addingRoster ? `<div class="tick-list">${rosterTickList}</div>` : ''}
          ${addingCustom ? `
            <form onsubmit="App.submitCustomParticipant(event,'${ev.id}')" class="row" style="margin-top:10px;">
              <input name="customName" placeholder="Name (not in roster)">
              <button type="submit" class="btn btn-primary" style="flex:0 0 auto;">Add</button>
            </form>
          ` : ''}
        ` : ''}
      </div>`;
  }).join('');

  return `
    <div class="stat-grid">
      <div class="card stat-card"><div class="stat-label">MEMBERS</div><div class="stat-value mono">${totalMembers}</div></div>
      <div class="card stat-card"><div class="stat-label">COLLECTED</div><div class="stat-value mono" style="color:var(--green)">${fmtDT(totalCollected)}</div></div>
      <div class="card stat-card"><div class="stat-label">OUTSTANDING</div><div class="stat-value mono" style="color:var(--red)">${fmtDT(totalOutstanding)}</div></div>
    </div>

    <div class="section-title">Roster</div>
    <div class="card" style="margin-bottom:18px;">
      ${rosterChips}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
        <button class="btn ${state.ui.showMemberForm ? 'btn-primary' : ''}" onclick="App.toggleMemberForm()">${svg('plus', 14)} Add member</button>
        <button class="btn ${state.ui.showBulkMemberForm ? 'btn-primary' : ''}" onclick="App.toggleBulkMemberForm()">${svg('plus', 14)} Add a list</button>
      </div>
      ${state.ui.showMemberForm ? `
        <form onsubmit="App.submitMember(event)" class="row" style="margin-top:10px;">
          <input name="name" placeholder="Member name">
          <button type="submit" class="btn btn-primary" style="flex:0 0 auto;">Add</button>
        </form>
      ` : ''}
      ${state.ui.showBulkMemberForm ? `
        <form onsubmit="App.submitBulkMembers(event)" style="margin-top:10px;">
          <textarea name="names" rows="6" placeholder="Paste names, one per line — e.g.&#10;Ahmed Ben Ali&#10;Sara Trabelsi&#10;Youssef Gharbi"></textarea>
          <div class="muted" style="font-size:11px;margin:6px 2px 10px;">One name per line (commas also work). Anything already in the roster is skipped automatically.</div>
          <button type="submit" class="btn btn-primary">Add them all</button>
        </form>
      ` : ''}
    </div>

    <div class="section-title">Fee events</div>
    <button class="btn ${state.ui.showFeeEventForm ? 'btn-primary' : ''}" onclick="App.toggleFeeEventForm()">${svg('plus', 14)} Add fee event</button>
    ${state.ui.showFeeEventForm ? `
      <form class="card panel" onsubmit="App.submitFeeEvent(event)">
        <div class="row"><input name="name" placeholder="Event name (e.g. Membership Fees 2026)"></div>
        <div class="row"><input name="amount" type="number" step="0.001" min="0" placeholder="Suggested amount per person (DT)"></div>
        <div class="field-label">MONEY GOES INTO</div>
        <div class="acct-pick">
          ${ACCOUNTS.map(a => `<button type="button" class="${state.ui.feeEventAccount === a.id ? 'active' : ''}" onclick="App.setFeeEventAccount('${a.id}', this)">${a.label}</button>`).join('')}
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
    ` : ''}

    <div style="margin-top:16px;">${events}</div>
  `;
}

function renderTadwira() {
  // How much each board member has actually paid (status === 'paid' only — an amount
  // typed into a still-unpaid row isn't collected yet), summed across every Tadwira.
  const spendByMember = {};
  state.tadwiraContributions.forEach(c => {
    if (c.status === 'paid') spendByMember[c.boardMemberId] = (spendByMember[c.boardMemberId] || 0) + (Number(c.paid) || 0);
  });
  const totalPaidAll = state.tadwiraContributions.reduce((s, c) => s + (c.status === 'paid' ? (Number(c.paid) || 0) : 0), 0);
  const totalExpectedAll = state.tadwiraContributions.reduce((s, c) => s + (Number(c.expected) || 0), 0);

  const boardRows = state.boardMembers.length === 0 ? `<div class="empty">No board members yet.</div>` : state.boardMembers.map(m => {
    const paid = spendByMember[m.id] || 0;
    const roleColor = boardRoleTextColor(m.role);
    return `
      <div class="fee-row">
        <div style="min-width:0;">
          <div class="fee-label">${esc(m.name)}</div>
          <div style="font-size:10px;font-weight:800;color:${roleColor};">${esc(m.role || '')}</div>
        </div>
        <div style="text-align:right;flex:1;">
          <div class="mono" style="font-size:13px;font-weight:700;">${fmtDT(paid)}</div>
        </div>
      </div>`;
  }).join('');

  const tadwiraCards = state.tadwiras.length === 0 ? `<div class="empty">No Tadwiras logged yet.</div>` : state.tadwiras.map(tw => {
    const open = state.ui.openTadwiraId === tw.id;
    const rows = state.tadwiraContributions.filter(c => c.tadwiraId === tw.id);
    const twExpected = rows.reduce((s, c) => s + (Number(c.expected) || 0), 0);
    const twPaid = rows.reduce((s, c) => s + (c.status === 'paid' ? (Number(c.paid) || 0) : 0), 0);
    return `
      <div class="card member-card" style="margin-bottom:10px;">
        <div class="note-head" onclick="App.toggleTadwiraOpen('${tw.id}')">
          <div>
            <div class="note-title">${esc(tw.description)}</div>
            <div class="mono" style="font-size:11px;color:var(--muted);font-weight:700;">
              ${fmtDate(tw.date)} · ${fmtDT(twPaid)} collected${tw.totalCost ? ` of ${fmtDT(tw.totalCost)} needed` : ''}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <button class="icon-btn" onclick="event.stopPropagation(); App.deleteTadwira('${tw.id}')">${svg('trash', 13)}</button>
            <span style="transform:rotate(${open ? 180 : 0}deg);transition:transform .15s;">${svg('chevron', 16)}</span>
          </div>
        </div>
        ${open ? `
          <div style="margin-top:12px;">
            ${state.boardMembers.length === 0 ? `<div class="empty">Add board members first.</div>` : state.boardMembers.map(m => {
              const rec = state.tadwiraContributions.find(c => c.tadwiraId === tw.id && c.boardMemberId === m.id);
              const expected = rec ? rec.expected : 0;
              const isPaid = rec && rec.status === 'paid';
              const displayAmount = rec ? (rec.paid && rec.paid > 0 ? rec.paid : rec.expected) : 0;
              return `
                <div class="fee-row">
                  <div class="fee-label" style="flex:1.3;min-width:0;">${esc(m.name)}</div>
                  <span class="muted" style="font-size:10px;">Exp.</span>
                  <input type="number" step="0.001" min="0" class="fee-amount-input" style="width:56px;margin-right:6px;" value="${expected}" onchange="App.setContributionExpected('${tw.id}','${m.id}', this.value)">
                  ${isPaid
                    ? `<div class="mono" style="font-size:12.5px;font-weight:700;margin-right:8px;">${fmtDT(rec.paid)}</div>`
                    : `<input type="number" step="0.001" min="0" class="fee-amount-input" style="width:64px;margin-right:6px;" value="${displayAmount}" onchange="App.setContributionAmount('${tw.id}','${m.id}', this.value)">`
                  }
                  <button class="toggle-pill ${isPaid ? 'paid' : 'unpaid'}" onclick="App.toggleContributionPaid('${tw.id}','${m.id}')">${isPaid ? 'Paid' : 'Unpaid'}</button>
                </div>`;
            }).join('')}
            <div class="fee-row" style="border-top:1.5px solid var(--ink);margin-top:4px;padding-top:8px;">
              <div class="fee-label" style="font-weight:800;">Total</div>
              <div class="mono" style="font-size:12.5px;font-weight:800;">${fmtDT(twPaid)} / ${fmtDT(twExpected)} expected</div>
            </div>
          </div>
        ` : ''}
      </div>`;
  }).join('');

  return `
    <div class="stat-grid">
      <div class="card stat-card"><div class="stat-label">TADWIRAS</div><div class="stat-value mono">${state.tadwiras.length}</div></div>
      <div class="card stat-card"><div class="stat-label">TOTAL EXPECTED</div><div class="stat-value mono">${fmtDT(totalExpectedAll)}</div></div>
      <div class="card stat-card"><div class="stat-label">TOTAL COLLECTED</div><div class="stat-value mono" style="color:var(--green)">${fmtDT(totalPaidAll)}</div></div>
    </div>

    <div class="section-title">Board spending</div>
    <div class="card" style="margin-bottom:18px;">
      ${boardRows}
    </div>

    <div class="section-title">Tadwiras</div>
    <button class="btn ${state.ui.showTadwiraForm ? 'btn-primary' : ''}" onclick="App.toggleTadwiraForm()">${svg('plus', 14)} Add Tadwira</button>
    ${state.ui.showTadwiraForm ? `
      <form class="card panel" onsubmit="App.submitTadwira(event)">
        <div class="row"><input name="description" placeholder="What's it for? (e.g. Jury gift)"></div>
        <div class="row"><input name="totalCost" type="number" step="0.001" min="0" placeholder="Total cost (DT) — optional, just for reference"></div>
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
    ` : ''}

    <div style="margin-top:16px;">${tadwiraCards}</div>
  `;
}

function renderInsights() {
  const b = balances();
  const total = b.carte_bancaire + b.d17 + b.cash;
  const insights = [];

  const lowest = ACCOUNTS.reduce((m, a) => (b[a.id] < b[m.id] ? a : m), ACCOUNTS[0]);
  insights.push({ icon: 'wallet', title: `${fmtDT(total)} across 3 accounts`,
    desc: `${lowest.label} is currently the lowest at ${fmtDT(b[lowest.id])}.` });

  const upcoming = state.opportunities.filter(o => {
    const d = daysUntil(o.deadline);
    return d !== null && d >= 0 && d <= 30 && o.status !== 'Won' && o.status !== 'Rejected';
  });
  insights.push({ icon: 'clock', title: upcoming.length ? `${upcoming.length} opportunity deadline${upcoming.length>1?'s':''} within 30 days` : 'No opportunity deadlines within 30 days',
    desc: upcoming.length ? upcoming.map(o => `${o.name} (${fmtDate(o.deadline)})`).join(', ') : 'Nothing urgent on the funding side right now.' });

  if (!state.oppsRefreshedAt) {
    insights.push({ icon: 'search', title: 'Opportunities have never been refreshed',
      desc: 'Ask me to check for new relevant grants, competitions, and incubators whenever you get a chance.' });
  } else {
    const daysAgo = -daysUntil(state.oppsRefreshedAt);
    if (daysAgo >= 30) {
      insights.push({ icon: 'search', title: `Opportunities last refreshed ${daysAgo} days ago`,
        desc: 'That\'s a while — worth asking for a fresh check on new grants, competitions, and incubators.' });
    } else {
      insights.push({ icon: 'search', title: `Opportunities refreshed ${daysAgo === 0 ? 'today' : daysAgo + ' day' + (daysAgo === 1 ? '' : 's') + ' ago'}`,
        desc: 'Still fairly recent — no need to check again yet.' });
    }
  }

  const last30 = state.transactions.filter(t => { const d = daysUntil(t.date); return d !== null && d >= -30 && d <= 0; });
  const inSum = last30.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount||0),0);
  const outSum = last30.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount||0),0);
  insights.push({ icon: 'up', title: `Last 30 days: ${fmtDT(inSum)} in, ${fmtDT(outSum)} out`,
    desc: `Net ${fmtDT(inSum-outSum)} over ${last30.length} entr${last30.length===1?'y':'ies'}.` });

  if (state.transactions.length) {
    const last = state.transactions[0];
    let label, amountStr;
    if (last.type === 'transfer') {
      const fromAcc = ACCOUNTS.find(a=>a.id===last.fromAccount);
      const toAcc = ACCOUNTS.find(a=>a.id===last.toAccount);
      label = `${fromAcc?fromAcc.label:last.fromAccount} → ${toAcc?toAcc.label:last.toAccount}`;
      amountStr = fmtDT(last.amount);
    } else {
      label = esc(last.category);
      amountStr = `${last.type==='income'?'+':'-'}${fmtDT(last.amount)}`;
    }
    insights.push({ icon: 'search', title: `Most recent entry: ${label}`,
      desc: `${amountStr} on ${fmtDate(last.date)}${last.loggedBy?` · logged by ${esc(last.loggedBy)}`:''}.` });
  }

  insights.push({ icon: 'bulb', title: `${state.notes.length} handover note${state.notes.length===1?'':'s'} on file`,
    desc: 'Check the Handover notes tab before your first sponsorship push — it holds the constraints every FO needs to know.' });

  return `
    ${insights.map(i => `
      <div class="card insight-card">
        <div class="insight-icon">${svg(i.icon,16)}</div>
        <div>

// ============== LOCK SCREEN (device PIN — protects local viewing only) ==============
const lockUi = { attempts: 0, lockedUntil: 0, error: '' };

function hasPinSet() { return !!localStorage.getItem('etbs_pin_hash'); }

async function storePin(pin) {
  const salt = bufToB64(crypto.getRandomValues(new Uint8Array(16)));
  const hash = await sha256Hex(salt + pin);
  localStorage.setItem('etbs_pin_salt', salt);
  localStorage.setItem('etbs_pin_hash', hash);
}
async function pinMatches(pin) {
  const salt = localStorage.getItem('etbs_pin_salt') || '';
  const hash = await sha256Hex(salt + pin);
  return hash === localStorage.getItem('etbs_pin_hash');
}

async function unlockApp() {
  document.getElementById('lock-screen').innerHTML = '';
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app-wrap').style.display = '';
  loadAll();
  render();
  renderSyncBadge();
  await bootSyncPull();
  applyOpportunityImportOnce();
  applyOpportunityRefreshSept2026Once();
  applyApArImportOnce();
  applyBoardPatchAzizOnce();
  render();
}

async function bootSyncPull() {
  if (!syncReady()) return;
  syncStatus = 'syncing';
  renderSyncBadge();
  try {
    await cloudPullAll();
    syncStatus = 'idle';
    render();
  } catch (err) {
    syncStatus = 'error';
    console.error('initial cloud pull failed', err);
  }
  renderSyncBadge();
}

function renderLock(mode) {
  const el = document.getElementById('lock-screen');
  el.style.display = '';
  document.getElementById('app-wrap').style.display = 'none';

  if (mode === 'setup') {
    el.innerHTML = `
      <div class="lock-wrap"><div class="lock-card">
        <div class="lock-logo"><img src="${LOGO_DATA_URI}" alt="logo"></div>
        <div class="lock-title">Create a PIN</div>
        <div class="pin-field-wrap">
          <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="pin-input" id="pin-a" placeholder="New PIN">
          <button type="button" class="pin-toggle-btn" onclick="togglePinVisibility(this)">${svg('eye', 14)}</button>
        </div>
        <div class="pin-field-wrap">
          <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="pin-input" id="pin-b" placeholder="Confirm PIN">
          <button type="button" class="pin-toggle-btn" onclick="togglePinVisibility(this)">${svg('eye', 14)}</button>
        </div>
        <div class="lock-error">${esc(lockUi.error)}</div>
        <button class="btn btn-primary" style="width:100%;" onclick="Lock.trySetup()">Set PIN & continue</button>
      </div></div>`;
  } else if (mode === 'enter') {
    const locked = Date.now() < lockUi.lockedUntil;
    el.innerHTML = `
      <div class="lock-wrap"><div class="lock-card">
        <div class="lock-logo"><img src="${LOGO_DATA_URI}" alt="logo"></div>
        <div class="lock-title">Enter PIN</div>
        <div class="lock-sub">Enactus TBS Treasury — this device is locked.</div>
        <div class="pin-field-wrap">
          <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="pin-input" id="pin-enter" placeholder="PIN" ${locked?'disabled':''}>
          <button type="button" class="pin-toggle-btn" onclick="togglePinVisibility(this)" ${locked?'disabled':''}>${svg('eye', 14)}</button>
        </div>
        <div class="lock-error">${locked ? 'Too many attempts. Wait 30 seconds and try again.' : esc(lockUi.error)}</div>
        <button class="btn btn-primary" style="width:100%;" ${locked?'disabled':''} onclick="Lock.tryEnter()">Unlock</button>
        <button type="button" class="lock-link" onclick="Lock.startForgot()">Forgot PIN?</button>
      </div></div>`;
  } else if (mode === 'forgot') {
    el.innerHTML = `
      <div class="lock-wrap"><div class="lock-card">
        <div class="lock-logo"><img src="${LOGO_DATA_URI}" alt="logo"></div>
        <div class="lock-title">Reset this device?</div>
        <div class="lock-warning">This erases the PIN <b>and all local data</b> on this device — balances, transactions, opportunities, notes. If you have an exported backup file, you can restore it afterwards with its own password.</div>
        <button class="btn" style="width:100%;color:var(--red);margin-bottom:8px;" onclick="Lock.confirmForgot()">Erase and start fresh</button>
        <button type="button" class="lock-link" onclick="Lock.cancelForgot()">Cancel, go back</button>
      </div></div>`;
  }
  const first = el.querySelector('input:not([disabled])');
  if (first) { first.focus(); first.addEventListener('keydown', e => { if (e.key === 'Enter') { if (mode==='setup') Lock.trySetup(); else if (mode==='enter') Lock.tryEnter(); } }); }
}

const Lock = {
  async trySetup() {
    const a = document.getElementById('pin-a').value.trim();
    const b = document.getElementById('pin-b').value.trim();
    if (!/^[0-9]{4,8}$/.test(a)) { lockUi.error = 'PIN must be 4–8 numbers.'; renderLock('setup'); return; }
    if (a !== b) { lockUi.error = "PINs don't match."; renderLock('setup'); return; }
    lockUi.error = '';
    await storePin(a);
    unlockApp();
  },
  async tryEnter() {
    if (Date.now() < lockUi.lockedUntil) return;
    const val = document.getElementById('pin-enter').value.trim();
    const ok = await pinMatches(val);
    if (ok) { lockUi.attempts = 0; lockUi.error = ''; unlockApp(); return; }
    lockUi.attempts++;
    lockUi.error = 'Incorrect PIN.';
    if (lockUi.attempts >= 5) {
      lockUi.lockedUntil = Date.now() + 30000;
      lockUi.attempts = 0;
      setTimeout(() => renderLock('enter'), 30000);
    }
    renderLock('enter');
  },
  startForgot() { renderLock('forgot'); },
  cancelForgot() { lockUi.error = ''; renderLock('enter'); },
  confirmForgot() {
    ['etbs_transactions','etbs_adjustments','etbs_opportunities','etbs_notes','etbs_logged_by','etbs_pin_hash','etbs_pin_salt'].forEach(k => localStorage.removeItem(k));
    lockUi.attempts = 0; lockUi.lockedUntil = 0; lockUi.error = '';
    renderLock('setup');
  },
  async changePin() {
    if (!CRYPTO_OK) { alert('PIN protection is unavailable in this browser context.'); return; }
    const current = await askPin({ title: 'Confirm current PIN', confirmLabel: 'Continue' });
    if (current === null) return;
    if (!(await pinMatches(current))) { alert('That PIN is incorrect.'); return; }
    const next = await askPin({ title: 'Choose a new PIN', confirmLabel: 'Next' });
    if (next === null) return;
    const confirmNext = await askPin({ title: 'Confirm new PIN', confirmLabel: 'Save' });
    if (confirmNext === null) return;
    if (next !== confirmNext) { alert("PINs didn't match — nothing changed."); return; }
    await storePin(next);
    alert('PIN updated.');
  },
  lockNow() {
    if (!CRYPTO_OK) { alert('PIN protection is unavailable in this browser context.'); return; }
    document.getElementById('app-wrap').style.display = 'none';
    lockUi.error = ''; lockUi.attempts = 0;
    renderLock('enter');
  },
};

function renderSyncBadge() {
  const el = document.getElementById('sync-badge');
  if (!el) return;
  if (!syncConnected()) { el.textContent = ''; el.className = 'sync-badge'; return; }
  if (!syncReady()) { el.textContent = '☁ Not synced yet'; el.className = 'sync-badge'; return; }
  if (syncStatus === 'syncing') { el.textContent = '☁ Syncing…'; el.className = 'sync-badge'; return; }
  if (syncStatus === 'error') { el.textContent = '☁ Sync failed — tap Cloud sync'; el.className = 'sync-badge err'; return; }
  const last = syncLastAt();
  el.textContent = last ? '☁ Synced ' + new Date(last).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '☁ Connected';
  el.className = 'sync-badge ok';
}

function renderSyncModal() {
  const overlay = document.createElement('div');
  overlay.className = 'sync-modal-overlay';
  overlay.id = 'sync-modal-overlay';

  let inner;
  if (!syncConnected()) {
    inner = `
      <div class="sync-modal-title">Connect cloud sync</div>
      <div class="sync-modal-sub">Paste the Web App URL and passphrase from your Google Apps Script backend. Any device that connects with the same two values shares the same data.</div>
      <form onsubmit="Sync.saveConnection(event)">
        <div class="sync-modal-row"><input name="url" placeholder="Web App URL (ends in /exec)" required></div>
        <div class="sync-modal-row"><input name="secret" placeholder="Passphrase" required></div>
        <div class="sync-modal-actions">
          <button type="submit" class="btn btn-primary">Test &amp; save</button>
          <button type="button" class="btn" onclick="Sync.close()">Cancel</button>
        </div>
      </form>`;
  } else if (!syncReady()) {
    inner = `
      <div class="sync-modal-title">Connected — one more step</div>
      <div class="sync-modal-sub">Which device has the real data right now?</div>
      <div class="sync-modal-actions">
        <button class="btn btn-primary" onclick="Sync.pushInitial()">This device has it — push to the sheet</button>
        <button class="btn" onclick="Sync.pullInitial()">The sheet already has it — pull it here</button>
        <button class="btn btn-ghost" style="color:var(--red);" onclick="Sync.disconnect()">Disconnect</button>
        <button type="button" class="btn" onclick="Sync.close()">Cancel</button>
      </div>`;
  } else {
    const last = syncLastAt();
    inner = `
      <div class="sync-modal-title">Cloud sync connected</div>
      <div class="sync-status-line">${last ? 'Last synced ' + esc(new Date(last).toLocaleString()) : 'Not synced yet'}</div>
      <div class="sync-modal-actions">
        <button class="btn btn-primary" onclick="Sync.pullNow()">Pull latest now</button>
        <button class="btn btn-ghost" style="color:var(--red);" onclick="Sync.disconnect()">Disconnect this device</button>
        <button type="button" class="btn" onclick="Sync.close()">Close</button>
      </div>`;
  }

  overlay.innerHTML = `<div class="sync-modal" style="position:relative;">
    <button class="sync-modal-close" onclick="Sync.close()">${svg('x', 16)}</button>
    ${inner}
  </div>`;
  document.body.appendChild(overlay);
  const firstInput = overlay.querySelector('input');
  if (firstInput) setTimeout(() => firstInput.focus(), 0);
}

const Sync = {
  open() { renderSyncModal(); },
  close() {
    const el = document.getElementById('sync-modal-overlay');
    if (el) el.remove();
  },
  async saveConnection(e) {
    e.preventDefault();
    const f = e.target;
    const url = f.url.value.trim();
    const secret = f.secret.value.trim();
    if (!url || !secret) return;
    const btn = f.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Testing…';
    localStorage.setItem('etbs_sync_url', url);
    localStorage.setItem('etbs_sync_secret', secret);
    try {
      await cloudGetAll();
    } catch (err) {
      alert('Could not connect: ' + (err.message || err) + '\n\nDouble-check the URL and passphrase, and that the script is deployed with access set to "Anyone".');
      localStorage.removeItem('etbs_sync_url');
      localStorage.removeItem('etbs_sync_secret');
      btn.disabled = false; btn.textContent = 'Test & save';
      return;
    }
    Sync.close();
    renderSyncModal();
    renderSyncBadge();
  },
  async pushInitial() {
    if (!confirm('This uploads everything currently on this device to the shared sheet, replacing whatever is there. Continue?')) return;
    try {
      await cloudPushAll();
      localStorage.setItem('etbs_sync_ready', '1');
      alert('Uploaded. Other devices can now connect with the same URL and passphrase and pull this data down.');
      Sync.close();
      renderSyncBadge();
    } catch (err) { alert('Push failed: ' + (err.message || err)); }
  },
  async pullInitial() {
    if (!confirm("This replaces this device's local data with whatever is currently in the sheet. Continue?")) return;
    try {
      await cloudPullAll();
      localStorage.setItem('etbs_sync_ready', '1');
      render();
      alert('Pulled the latest data from the sheet.');
      Sync.close();
      renderSyncBadge();
    } catch (err) { alert('Pull failed: ' + (err.message || err)); }
  },
  async pullNow() {
    try {
      await cloudPullAll();
      render();
      Sync.close();
      renderSyncModal();
      renderSyncBadge();
    } catch (err) { alert('Pull failed: ' + (err.message || err)); }
  },
  disconnect() {
    if (!confirm('Disconnect cloud sync on this device? Local data stays put, but this device will stop sharing changes with the others.')) return;
    ['etbs_sync_url', 'etbs_sync_secret', 'etbs_sync_ready', 'etbs_sync_last'].forEach(k => localStorage.removeItem(k));
    Sync.close();
    renderSyncBadge();
  },
};

// ============== MONTHLY REPORT ==============
function buildMonthlyReportHTML(monthStr, preparedBy) {
  const [y, m] = monthStr.split('-').map(Number);
  const monthLabel = new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const startISO = monthStr + '-01';
  const lastDay = new Date(y, m, 0).getDate();
  const endISO = monthStr + '-' + String(lastDay).padStart(2, '0');
  const dayBefore = addDaysISO(startISO, -1);

  const monthTx = state.transactions
    .filter(t => t.date && t.date >= startISO && t.date <= endISO)
    .slice()
    .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));

  const income = monthTx.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0);
  const expense = monthTx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);

  const opening = balancesAsOf(dayBefore);
  const closing = balancesAsOf(endISO);
  const openingTotal = opening.carte_bancaire + opening.d17 + opening.cash;
  const closingTotal = closing.carte_bancaire + closing.d17 + closing.cash;

  const txRows = monthTx.length === 0 ? `<tr><td colspan="5" class="report-empty">No transactions recorded this month.</td></tr>` : monthTx.map(t => {
    let desc, acctLabel;
    if (t.type === 'transfer') {
      const fromAcc = ACCOUNTS.find(a => a.id === t.fromAccount);
      const toAcc = ACCOUNTS.find(a => a.id === t.toAccount);
      desc = 'Transfer';
      acctLabel = `${fromAcc ? fromAcc.label : t.fromAccount} → ${toAcc ? toAcc.label : t.toAccount}`;
    } else {
      const acc = ACCOUNTS.find(a => a.id === t.account);
      desc = esc(t.category) + (t.note ? ' — ' + esc(t.note) : '');
      acctLabel = acc ? acc.label : t.account;
    }
    const amtClass = t.type === 'income' ? 'report-pos' : (t.type === 'expense' ? 'report-neg' : '');
    const amtPrefix = t.type === 'income' ? '+' : (t.type === 'expense' ? '-' : '');
    return `<tr><td>${fmtDate(t.date)}</td><td>${acctLabel}</td><td>${desc}</td><td>${esc(t.loggedBy || '')}</td><td class="num ${amtClass}">${amtPrefix}${fmtDT(t.amount)}</td></tr>`;
  }).join('');

  // Pending Accounts Payable/Receivable as of right now (not dated per item, so this
  // reflects the current outstanding total rather than a historical month-end snapshot).
  const pendingAp = state.payables.filter(p => p.status === 'pending');
  const pendingReceivable = pendingAp.filter(p => p.kind === 'receivable').reduce((s, p) => s + Number(p.amount || 0), 0);
  const pendingPayable = pendingAp.filter(p => p.kind === 'payable').reduce((s, p) => s + Number(p.amount || 0), 0);
  const projectedTotal = closingTotal + pendingReceivable - pendingPayable;

  return `
    <div class="report-page">
      <div class="report-header">
        <div>
          <div class="report-org">ENACTUS TBS</div>
          <div class="report-title">Monthly Financial Report</div>
          <div class="report-month">${esc(monthLabel)}</div>
        </div>
      </div>
      <div class="report-meta">Generated ${esc(new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' }))}${preparedBy ? ' · Prepared by ' + esc(preparedBy) : ''}</div>

      <h3>Summary</h3>
      <table class="report-table">
        <tr><td>Opening balance (${esc(fmtDate(dayBefore))})</td><td class="num">${fmtDT(openingTotal)}</td></tr>
        <tr><td>Total income</td><td class="num report-pos">+${fmtDT(income)}</td></tr>
        <tr><td>Total expenses</td><td class="num report-neg">-${fmtDT(expense)}</td></tr>
        <tr><td><strong>Closing balance (${esc(fmtDate(endISO))})</strong></td><td class="num"><strong>${fmtDT(closingTotal)}</strong></td></tr>
      </table>

      <h3>Balances by account</h3>
      <table class="report-table">
        <tr><th>Account</th><th class="num">Opening</th><th class="num">Closing</th></tr>
        ${ACCOUNTS.map(a => `<tr><td>${a.label}</td><td class="num">${fmtDT(opening[a.id])}</td><td class="num">${fmtDT(closing[a.id])}</td></tr>`).join('')}
      </table>

      <h3>Accounts payable / receivable</h3>
      <table class="report-table">
        <tr><td>Pending receivable</td><td class="num report-pos">+${fmtDT(pendingReceivable)}</td></tr>
        <tr><td>Pending payable</td><td class="num report-neg">-${fmtDT(pendingPayable)}</td></tr>
        <tr><td><strong>Projected treasury once settled</strong></td><td class="num"><strong>${fmtDT(projectedTotal)}</strong></td></tr>
      </table>

      <h3>All transactions</h3>
      <table class="report-table report-tx-table">
        <tr><th>Date</th><th>Account</th><th>Description</th><th>Logged by</th><th class="num">Amount</th></tr>
        ${txRows}
      </table>
    </div>
  `;
}

const Report = {
  open() { renderReportModal(); },

    const monthVal = document.getElementById('report-month-input').value;

    if (preparedBy) localStorage.setItem('etbs_report_prepared_by', preparedBy);
    document.getElementById('report-print-area').innerHTML = buildMonthlyReportHTML(monthVal, preparedBy);
    Report.close();

    const [y, m] = monthVal.split('-').map(Number);
    const monthLabel = new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    const originalTitle = document.title;
    document.title = 'Monthly Financial Report - ' + monthLabel;
    const restoreTitle = () => { document.title = originalTitle; window.removeEventListener('afterprint', restoreTitle); };
    window.addEventListener('afterprint', restoreTitle);

    setTimeout(() => window.print(), 50);
  },
};

document.getElementById('apple-touch-link').href = LOGO_DATA_URI;
document.getElementById('header-logo').innerHTML = `<img src="${LOGO_DATA_URI}" alt="logo">`;
document.getElementById('enactus-logo-header').src = ENACTUS_LOGO_DATA_URI;

// A real Web App Manifest is what makes Android Chrome treat this as a genuinely
// installable app (full-screen, no address bar) instead of a plain bookmark shortcut.
(function attachManifest() {
  const manifest = {
    name: 'Enactus TBS Treasury',
    short_name: 'ETBS Treasury',
    start_url: window.location.href,
    scope: window.location.href,
    display: 'standalone',
    background_color: '#FFFDF6',
    theme_color: '#FFC222',
    icons: [
      { src: LOGO_DATA_URI, sizes: '512x512', type: 'image/png' },
      { src: LOGO_DATA_URI, sizes: '192x192', type: 'image/png' },
    ],
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  document.getElementById('manifest-link').href = URL.createObjectURL(blob);
})();

const CRYPTO_OK = !!(window.crypto && window.crypto.subtle);
if (CRYPTO_OK) {
  renderLock(hasPinSet() ? 'enter' : 'setup');
} else {
  // No PIN lock / encrypted backups available in this browsing context (e.g. some in-app
  // browsers). Open the app anyway rather than showing a broken screen.
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app-wrap').style.display = '';
  console.warn('Web Crypto unavailable in this context — PIN lock and encrypted backups are disabled. Try opening this file directly in Chrome or Safari instead of an in-app browser.');
  loadAll();
  render();
  renderSyncBadge();
  bootSyncPull().then(() => {
    applyOpportunityImportOnce();
    applyOpportunityRefreshSept2026Once();
    applyApArImportOnce();
    applyBoardPatchAzizOnce();
    render();
  });
}
</script>
