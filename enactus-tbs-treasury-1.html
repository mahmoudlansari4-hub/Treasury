  insights.push({ icon: 'bulb', title: `${state.notes.length} handover note${state.notes.length===1?'':'s'} on file`,
    desc: 'Check the Handover notes tab before your first sponsorship push — it holds the constraints every FO needs to know.' });

  return `
    <div class="card" style="margin-bottom:14px;background:#FFFBF0;border-color:#F3DFA6;">
      <div style="font-size:12.5px;color:var(--gold-deep);font-weight:700;">Auto-generated from your data — not AI. Plain calculations, updated instantly as you add entries.</div>
    </div>
    ${insights.map(i => `
      <div class="card insight-card">

    <div class="section-title">${svg('send',15)} AI chat <span class="muted" style="font-weight:500;font-size:11.5px;">— optional, uses your own free Gemini key</span></div>
    ${(!state.geminiKey || state.ui.editingKey) ? `

        </div>
        <form onsubmit="App.saveGeminiKey(event)" class="row">

// ============== LOCK SCREEN (device PIN — protects local viewing only) ==============
const lockUi = { attempts: 0, lockedUntil: 0, error: '' };

function hasPinSet() { return !!localStorage.getItem('etbs_pin_hash'); }

async function storePin(pin) {
  const salt = bufToB64(crypto.getRandomValues(new Uint8Array(16)));
  const hash = await sha256Hex(salt + pin);
  localStorage.setItem('etbs_pin_salt', salt);
  localStorage.setItem('etbs_pin_hash', hash);
}
async function pinMatches(pin) {
  const salt = localStorage.getItem('etbs_pin_salt') || '';
  const hash = await sha256Hex(salt + pin);
  return hash === localStorage.getItem('etbs_pin_hash');
}

async function unlockApp() {
  document.getElementById('lock-screen').innerHTML = '';
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app-wrap').style.display = '';
  loadAll();
  render();
  renderSyncBadge();
  await bootSyncPull();
  applyOpportunityImportOnce();
  applyApArImportOnce();
  render();
}

async function bootSyncPull() {
  if (!syncReady()) return;
  syncStatus = 'syncing';
  renderSyncBadge();
  try {
    await cloudPullAll();
    syncStatus = 'idle';
    render();
  } catch (err) {
    syncStatus = 'error';
    console.error('initial cloud pull failed', err);
  }
  renderSyncBadge();
}

function renderLock(mode) {
  const el = document.getElementById('lock-screen');
  el.style.display = '';
  document.getElementById('app-wrap').style.display = 'none';

  if (mode === 'setup') {
    el.innerHTML = `
      <div class="lock-wrap"><div class="lock-card">
        <div class="lock-logo"><img src="${LOGO_DATA_URI}" alt="logo"></div>
        <div class="lock-title">Create a PIN</div>
        <div class="lock-sub">Protects this app on this device. Numbers only, 4–8 digits. Remember it — there's no email recovery, only a full local reset.</div>
        <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="pin-input" id="pin-a" placeholder="New PIN">
        <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="pin-input" id="pin-b" placeholder="Confirm PIN">
        <div class="lock-error">${esc(lockUi.error)}</div>
        <button class="btn btn-primary" style="width:100%;" onclick="Lock.trySetup()">Set PIN & continue</button>
      </div></div>`;
  } else if (mode === 'enter') {
    const locked = Date.now() < lockUi.lockedUntil;
    el.innerHTML = `
      <div class="lock-wrap"><div class="lock-card">
        <div class="lock-logo"><img src="${LOGO_DATA_URI}" alt="logo"></div>
        <div class="lock-title">Enter PIN</div>
        <div class="lock-sub">Enactus TBS Treasury — this device is locked.</div>
        <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="pin-input" id="pin-enter" placeholder="PIN" ${locked?'disabled':''}>
        <div class="lock-error">${locked ? 'Too many attempts. Wait 30 seconds and try again.' : esc(lockUi.error)}</div>
        <button class="btn btn-primary" style="width:100%;" ${locked?'disabled':''} onclick="Lock.tryEnter()">Unlock</button>
        <button type="button" class="lock-link" onclick="Lock.startForgot()">Forgot PIN?</button>
      </div></div>`;
  } else if (mode === 'forgot') {
    el.innerHTML = `
      <div class="lock-wrap"><div class="lock-card">
        <div class="lock-logo"><img src="${LOGO_DATA_URI}" alt="logo"></div>
        <div class="lock-title">Reset this device?</div>
        <div class="lock-warning">This erases the PIN <b>and all local data</b> on this device — balances, transactions, opportunities, notes. If you have an exported backup file, you can restore it afterwards with its own password.</div>
        <button class="btn" style="width:100%;color:var(--red);margin-bottom:8px;" onclick="Lock.confirmForgot()">Erase and start fresh</button>
        <button type="button" class="lock-link" onclick="Lock.cancelForgot()">Cancel, go back</button>
      </div></div>`;
  }
  const first = el.querySelector('input:not([disabled])');
  if (first) { first.focus(); first.addEventListener('keydown', e => { if (e.key === 'Enter') { if (mode==='setup') Lock.trySetup(); else if (mode==='enter') Lock.tryEnter(); } }); }
}

const Lock = {
  async trySetup() {
    const a = document.getElementById('pin-a').value.trim();
    const b = document.getElementById('pin-b').value.trim();
    if (!/^[0-9]{4,8}$/.test(a)) { lockUi.error = 'PIN must be 4–8 numbers.'; renderLock('setup'); return; }
    if (a !== b) { lockUi.error = "PINs don't match."; renderLock('setup'); return; }
    lockUi.error = '';
    await storePin(a);
    unlockApp();
  },
  async tryEnter() {
    if (Date.now() < lockUi.lockedUntil) return;
    const val = document.getElementById('pin-enter').value.trim();
    const ok = await pinMatches(val);
    if (ok) { lockUi.attempts = 0; lockUi.error = ''; unlockApp(); return; }
    lockUi.attempts++;
    lockUi.error = 'Incorrect PIN.';
    if (lockUi.attempts >= 5) {
      lockUi.lockedUntil = Date.now() + 30000;
      lockUi.attempts = 0;
      setTimeout(() => renderLock('enter'), 30000);
    }
    renderLock('enter');
  },
  startForgot() { renderLock('forgot'); },
  cancelForgot() { lockUi.error = ''; renderLock('enter'); },
  confirmForgot() {
    ['etbs_transactions','etbs_adjustments','etbs_opportunities','etbs_notes','etbs_logged_by','etbs_pin_hash','etbs_pin_salt'].forEach(k => localStorage.removeItem(k));
    lockUi.attempts = 0; lockUi.lockedUntil = 0; lockUi.error = '';
    renderLock('setup');
  },
  async changePin() {
    if (!CRYPTO_OK) { alert('PIN protection is unavailable in this browser context.'); return; }
    const current = await askPin({ title: 'Confirm current PIN', confirmLabel: 'Continue' });
    if (current === null) return;
    if (!(await pinMatches(current))) { alert('That PIN is incorrect.'); return; }
    const next = await askPin({ title: 'Choose a new PIN', confirmLabel: 'Next' });
    if (next === null) return;
    const confirmNext = await askPin({ title: 'Confirm new PIN', confirmLabel: 'Save' });
    if (confirmNext === null) return;
    if (next !== confirmNext) { alert("PINs didn't match — nothing changed."); return; }
    await storePin(next);
    alert('PIN updated.');
  },
  lockNow() {
    if (!CRYPTO_OK) { alert('PIN protection is unavailable in this browser context.'); return; }
    document.getElementById('app-wrap').style.display = 'none';
    lockUi.error = ''; lockUi.attempts = 0;
    renderLock('enter');
  },
};

function renderSyncBadge() {
  const el = document.getElementById('sync-badge');
  if (!el) return;
  if (!syncConnected()) { el.textContent = ''; el.className = 'sync-badge'; return; }
  if (!syncReady()) { el.textContent = '☁ Not synced yet'; el.className = 'sync-badge'; return; }
  if (syncStatus === 'syncing') { el.textContent = '☁ Syncing…'; el.className = 'sync-badge'; return; }
  if (syncStatus === 'error') { el.textContent = '☁ Sync failed — tap Cloud sync'; el.className = 'sync-badge err'; return; }
  const last = syncLastAt();
  el.textContent = last ? '☁ Synced ' + new Date(last).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '☁ Connected';
  el.className = 'sync-badge ok';
}

function renderSyncModal() {
  const overlay = document.createElement('div');
  overlay.className = 'sync-modal-overlay';
  overlay.id = 'sync-modal-overlay';

  let inner;
  if (!syncConnected()) {
    inner = `
      <div class="sync-modal-title">Connect cloud sync</div>
      <div class="sync-modal-sub">Paste the Web App URL and passphrase from your Google Apps Script backend. Any device that connects with the same two values shares the same data.</div>
      <form onsubmit="Sync.saveConnection(event)">
        <div class="sync-modal-row"><input name="url" placeholder="Web App URL (ends in /exec)" required></div>
        <div class="sync-modal-row"><input name="secret" placeholder="Passphrase" required></div>
        <div class="sync-modal-actions">
          <button type="submit" class="btn btn-primary">Test &amp; save</button>
          <button type="button" class="btn" onclick="Sync.close()">Cancel</button>
        </div>
      </form>`;
  } else if (!syncReady()) {
    inner = `
      <div class="sync-modal-title">Connected — one more step</div>
      <div class="sync-modal-sub">Which device has the real data right now?</div>
      <div class="sync-modal-actions">
        <button class="btn btn-primary" onclick="Sync.pushInitial()">This device has it — push to the sheet</button>
        <button class="btn" onclick="Sync.pullInitial()">The sheet already has it — pull it here</button>
        <button class="btn btn-ghost" style="color:var(--red);" onclick="Sync.disconnect()">Disconnect</button>
        <button type="button" class="btn" onclick="Sync.close()">Cancel</button>
      </div>`;
  } else {
    const last = syncLastAt();
    inner = `
      <div class="sync-modal-title">Cloud sync connected</div>
      <div class="sync-status-line">${last ? 'Last synced ' + esc(new Date(last).toLocaleString()) : 'Not synced yet'}</div>
      <div class="sync-modal-actions">
        <button class="btn btn-primary" onclick="Sync.pullNow()">Pull latest now</button>
        <button class="btn btn-ghost" style="color:var(--red);" onclick="Sync.disconnect()">Disconnect this device</button>
        <button type="button" class="btn" onclick="Sync.close()">Close</button>
      </div>`;
  }

  overlay.innerHTML = `<div class="sync-modal" style="position:relative;">
    <button class="sync-modal-close" onclick="Sync.close()">${svg('x', 16)}</button>
    ${inner}
  </div>`;
  document.body.appendChild(overlay);
  const firstInput = overlay.querySelector('input');
  if (firstInput) setTimeout(() => firstInput.focus(), 0);
}

const Sync = {
  open() { renderSyncModal(); },
  close() {
    const el = document.getElementById('sync-modal-overlay');
    if (el) el.remove();
  },
  async saveConnection(e) {
    e.preventDefault();
    const f = e.target;
    const url = f.url.value.trim();
    const secret = f.secret.value.trim();
    if (!url || !secret) return;
    const btn = f.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Testing…';
    localStorage.setItem('etbs_sync_url', url);
    localStorage.setItem('etbs_sync_secret', secret);
    try {
      await cloudGetAll();
    } catch (err) {
      alert('Could not connect: ' + (err.message || err) + '\n\nDouble-check the URL and passphrase, and that the script is deployed with access set to "Anyone".');
      localStorage.removeItem('etbs_sync_url');
      localStorage.removeItem('etbs_sync_secret');
      btn.disabled = false; btn.textContent = 'Test & save';
      return;
    }
    Sync.close();
    renderSyncModal();
    renderSyncBadge();
  },
  async pushInitial() {
    if (!confirm('This uploads everything currently on this device to the shared sheet, replacing whatever is there. Continue?')) return;
    try {
      await cloudPushAll();
      localStorage.setItem('etbs_sync_ready', '1');
      alert('Uploaded. Other devices can now connect with the same URL and passphrase and pull this data down.');
      Sync.close();
      renderSyncBadge();
    } catch (err) { alert('Push failed: ' + (err.message || err)); }
  },
  async pullInitial() {
    if (!confirm("This replaces this device's local data with whatever is currently in the sheet. Continue?")) return;
    try {
      await cloudPullAll();
      localStorage.setItem('etbs_sync_ready', '1');
      render();
      alert('Pulled the latest data from the sheet.');
      Sync.close();
      renderSyncBadge();
    } catch (err) { alert('Pull failed: ' + (err.message || err)); }
  },
  async pullNow() {
    try {
      await cloudPullAll();
      render();
      Sync.close();
      renderSyncModal();
      renderSyncBadge();
    } catch (err) { alert('Pull failed: ' + (err.message || err)); }
  },
  disconnect() {
    if (!confirm('Disconnect cloud sync on this device? Local data stays put, but this device will stop sharing changes with the others.')) return;
    ['etbs_sync_url', 'etbs_sync_secret', 'etbs_sync_ready', 'etbs_sync_last'].forEach(k => localStorage.removeItem(k));
    Sync.close();
    renderSyncBadge();
  },
};

// ============== MONTHLY REPORT ==============
function buildMonthlyReportHTML(monthStr, preparedBy) {
  const [y, m] = monthStr.split('-').map(Number);
  const monthLabel = new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const startISO = monthStr + '-01';
  const lastDay = new Date(y, m, 0).getDate();
  const endISO = monthStr + '-' + String(lastDay).padStart(2, '0');
  const dayBefore = addDaysISO(startISO, -1);

  const monthTx = state.transactions
    .filter(t => t.date && t.date >= startISO && t.date <= endISO)
    .slice()
    .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));

  const income = monthTx.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0);
  const expense = monthTx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);

  const opening = balancesAsOf(dayBefore);
  const closing = balancesAsOf(endISO);
  const openingTotal = opening.carte_bancaire + opening.d17 + opening.cash;
  const closingTotal = closing.carte_bancaire + closing.d17 + closing.cash;

  const txRows = monthTx.length === 0 ? `<tr><td colspan="5" class="report-empty">No transactions recorded this month.</td></tr>` : monthTx.map(t => {
    let desc, acctLabel;
    if (t.type === 'transfer') {
      const fromAcc = ACCOUNTS.find(a => a.id === t.fromAccount);
      const toAcc = ACCOUNTS.find(a => a.id === t.toAccount);
      desc = 'Transfer';
      acctLabel = `${fromAcc ? fromAcc.label : t.fromAccount} → ${toAcc ? toAcc.label : t.toAccount}`;
    } else {
      const acc = ACCOUNTS.find(a => a.id === t.account);
      desc = esc(t.category) + (t.note ? ' — ' + esc(t.note) : '');
      acctLabel = acc ? acc.label : t.account;
    }
    const amtClass = t.type === 'income' ? 'report-pos' : (t.type === 'expense' ? 'report-neg' : '');
    const amtPrefix = t.type === 'income' ? '+' : (t.type === 'expense' ? '-' : '');
    return `<tr><td>${fmtDate(t.date)}</td><td>${acctLabel}</td><td>${desc}</td><td>${esc(t.loggedBy || '')}</td><td class="num ${amtClass}">${amtPrefix}${fmtDT(t.amount)}</td></tr>`;
  }).join('');

  return `
    <div class="report-page">
      <div class="report-header">
        <div>
          <div class="report-org">ENACTUS TBS</div>
          <div class="report-title">Monthly Financial Report</div>
          <div class="report-month">${esc(monthLabel)}</div>
        </div>
      </div>
      <div class="report-meta">Generated ${esc(new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' }))}${preparedBy ? ' · Prepared by ' + esc(preparedBy) : ''}</div>

      <h3>Summary</h3>
      <table class="report-table">
        <tr><td>Opening balance (${esc(fmtDate(dayBefore))})</td><td class="num">${fmtDT(openingTotal)}</td></tr>
        <tr><td>Total income</td><td class="num report-pos">+${fmtDT(income)}</td></tr>
        <tr><td>Total expenses</td><td class="num report-neg">-${fmtDT(expense)}</td></tr>
        <tr><td><strong>Closing balance (${esc(fmtDate(endISO))})</strong></td><td class="num"><strong>${fmtDT(closingTotal)}</strong></td></tr>
      </table>

      <h3>Balances by account</h3>
      <table class="report-table">
        <tr><th>Account</th><th class="num">Opening</th><th class="num">Closing</th></tr>
        ${ACCOUNTS.map(a => `<tr><td>${a.label}</td><td class="num">${fmtDT(opening[a.id])}</td><td class="num">${fmtDT(closing[a.id])}</td></tr>`).join('')}
      </table>

      <h3>All transactions</h3>
      <table class="report-table report-tx-table">
        <tr><th>Date</th><th>Account</th><th>Description</th><th>Logged by</th><th class="num">Amount</th></tr>
        ${txRows}
      </table>
    </div>
  `;
}

      <div class="report-modal-title">Monthly report</div>
      <div class="report-modal-sub">Pick a month. It opens your browser's print dialog — choose "Save as PDF" there to get the file. In that dialog, also switch off "Headers and footers" so the browser doesn't add its own title/date line on top of the report.</div>
      <input type="month" id="report-month-input" value="${thisMonth}" style="margin-bottom:10px;">
      <input type="text" id="report-preparedby-input" placeholder="Prepared by (full name)" value="${esc(savedName)}">
      <div class="report-modal-actions">
        <button type="button" class="btn" onclick="Report.close()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="Report.generate()">Generate</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

const Report = {
  open() { renderReportModal(); },
  close() {
    const el = document.getElementById('report-modal-overlay');
    if (el) el.remove();
  },
  generate() {
    const monthVal = document.getElementById('report-month-input').value;
    if (!monthVal) return;
    const preparedBy = document.getElementById('report-preparedby-input').value.trim();
    if (preparedBy) localStorage.setItem('etbs_report_prepared_by', preparedBy);
    document.getElementById('report-print-area').innerHTML = buildMonthlyReportHTML(monthVal, preparedBy);
    Report.close();

    const [y, m] = monthVal.split('-').map(Number);
    const monthLabel = new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    const originalTitle = document.title;
    document.title = 'Monthly Financial Report - ' + monthLabel;
    const restoreTitle = () => { document.title = originalTitle; window.removeEventListener('afterprint', restoreTitle); };
    window.addEventListener('afterprint', restoreTitle);

    setTimeout(() => window.print(), 50);
  },
};

// Apply the club logo to the favicon, home-screen icon, and header badge.
document.getElementById('favicon-link').href = LOGO_DATA_URI;
document.getElementById('apple-touch-link').href = LOGO_DATA_URI;
document.getElementById('header-logo').innerHTML = `<img src="${LOGO_DATA_URI}" alt="logo">`;

const CRYPTO_OK = !!(window.crypto && window.crypto.subtle);
if (CRYPTO_OK) {
  renderLock(hasPinSet() ? 'enter' : 'setup');
} else {
  // No PIN lock / encrypted backups available in this browsing context (e.g. some in-app
  // browsers). Open the app anyway rather than showing a broken screen.
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app-wrap').style.display = '';
  console.warn('Web Crypto unavailable in this context — PIN lock and encrypted backups are disabled. Try opening this file directly in Chrome or Safari instead of an in-app browser.');
  loadAll();
  render();
  renderSyncBadge();
  bootSyncPull().then(() => {
    applyOpportunityImportOnce();
    applyApArImportOnce();
    render();
  });
}
</script>
</body>
</html>
